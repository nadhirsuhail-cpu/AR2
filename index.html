/* Pengumpul ralat — untuk pengesanan isu semasa pembangunan */
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push(String(e.message) + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  if (window.__errs.length > 30) window.__errs.shift();
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('promise: ' + String(e.reason && e.reason.message || e.reason));
  if (window.__errs.length > 30) window.__errs.shift();
});
</script>
