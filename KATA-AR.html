        "<span>" + d.ayat + "</span><br><span style=\"font-size:13px;font-weight:700\">" + d.deria + "</span></div>" +
        '<span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' + adaAudio +
        '<button class="btn btn-dengar btn-sm" data-dengar="' + d.ayat + '" aria-label="Dengar ayat">' + Ikon.iko("pembesarSuara", 17) + "</button></span></div>";
      if (d.audio) {
        el.querySelector("[data-main-audio]").addEventListener("click", function () {
          AudioMesin.bangunkan();
          AudioMesin[d.audio]();
        });
      }
    }
    el.querySelectorAll("[data-deria]").forEach(function (b) {
      b.addEventListener("click", function () { pilih(b.getAttribute("data-deria")); AudioMesin.klik(); });
    });
    document.getElementById("btnMulaCuba").addEventListener("click", function () { keadaan.soalanIdx = 0; fasaCuba(); });
    pilih(m.deria[0].id);
  }

  function wireKenali(id) {
    if (id === "jarak") wireJarak();
    else if (id === "perasaan") wirePerasaan();
    else wirePancaindera();
  }

  /* ============================================================
     FASA 2 — CUBA (soalan)
     ============================================================ */
  function fasaCuba() {
    var id = keadaan.id;
    var m = D.MODUL[id];
    var q = m.soalan[keadaan.soalanIdx];
    var el = document.getElementById("modul-kandungan");
    var jalur = document.getElementById("modul-jalur");
    if (jalur) jalur.style.width = Math.round(35 + ((keadaan.soalanIdx + 1) / m.soalan.length) * 55) + "%";

    var media = mediaSoalan(id, q);
    var pilihan = q.pilihan.map(function (p) {
      if (id === "perasaan") {
        return '<button class="pilihan-face" data-pilih="' + p + '">' + Ikon.wajah(p) + "<span>" + p + "</span></button>";
      }
      return '<button class="cip-kata" data-pilih="' + p + '">' + p + "</button>";
    }).join("");

    el.innerHTML = '<div class="kad kad-soalan">' +
      '<div class="soalan-kepala"><span class="soalan-no">SOALAN ' + (keadaan.soalanIdx + 1) + " / " + m.soalan.length + "</span>" +
      UI.chipKategori(id) + "</div>" +
      '<p class="soalan-teks">' + q.soalan.replace("______", '<span class="slot">______</span>') + "</p>" +
      media +
      '<div class="pilihan ' + (id === "perasaan" ? "pilihan-face-grup" : "") + '">' + pilihan + "</div>" +
      '<div id="maklumSoalan" aria-live="polite"></div>' +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-dengar btn-sm" data-dengar="' + q.soalan + '" aria-label="Dengar soalan">' + Ikon.iko("pembesarSuara", 17) + " Dengar</button>" +
      '<button class="btn btn-utama" id="btnSeterusnya" disabled>Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</button></div></div>";

    var sudah = false;
    var betulPertama = null;
    el.querySelectorAll("[data-pilih]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (sudah) return;
        var p = b.getAttribute("data-pilih");
        if (p === q.jawab) {
          if (betulPertama === null) betulPertama = true;
          sudah = true;
          b.classList.add("betul");
          AudioMesin.berjaya();
          Store.catatStat(id, betulPertama);
          maklumBenar(q);
          el.querySelector("#btnSeterusnya").disabled = false;
          el.querySelector("#btnSeterusnya").focus();
        } else {
          if (betulPertama === null) betulPertama = false;
          b.classList.add("salah");
          b.disabled = true;
          AudioMesin.gagal();
          maklumSalah(q, p);
        }
      });
    });

    el.querySelector("#btnSeterusnya").addEventListener("click", function () {
      keadaan.soalanIdx++;
      if (keadaan.soalanIdx < m.soalan.length) fasaCuba();
      else fasaSelesai();
    });

    /* mainkan audio pancaindera secara automatik selepas interaksi */
    var btnAudio = el.querySelector("[data-main-audio]");
    if (btnAudio) btnAudio.focus();
  }

  function mediaSoalan(id, q) {
    var isi = "";
    if (id === "jarak") {
      isi = '<div class="soalan-media" style="color:var(--jarak)">' + Ikon.jarakVisual(q.jarakNilai) + "</div>";
    } else if (id === "perasaan") {
      isi = '<div class="soalan-media" style="color:var(--perasaan);flex-direction:column;gap:12px">' +
        '<span style="font-size:16.5px;font-weight:700;color:var(--dakwat2)">' + q.cerita + "</span>" +
        Ikon.wajah(q.jawab) + "</div>";
    } else {
      if (q.audio) {
        isi = '<div class="soalan-media" style="color:var(--pancaindera)">' +
          '<button class="btn btn-utama" data-main-audio="' + q.audio + '">' + Ikon.iko("fonKepala", 18) + " Dengar Bunyi</button></div>";
      } else {
        isi = '<div class="soalan-media" style="color:var(--pancaindera)">' + Ikon.objek(q.objek) + "</div>";
      }
    }
    return isi;
  }

  function maklumBenar(q) {
    var el = document.getElementById("maklumSoalan");
    el.innerHTML = '<div class="maklum maklum-betul">' + Ikon.iko("semakBulat", 21) +
      '<div><strong>Hebat! Jawapan yang tepat ialah ' + q.jawab + '.</strong>' + q.penjelasan + "</div></div>";
  }

  function maklumSalah(q, pilihan) {
    var el = document.getElementById("maklumSoalan");
    var petunjuk = pilihan + " tidak sesuai di sini. Cuba fikir semula dan pilih jawapan lain.";
    el.innerHTML = '<div class="maklum maklum-salah">' + Ikon.iko("lampu", 21) +
      '<div><strong>Hampir betul! Cuba fikir semula.</strong>' + petunjuk + "</div></div>";
  }

  /* ============================================================
     FASA 3 — SELESAI
     ============================================================ */
  function fasaSelesai() {
    var id = keadaan.id;
    var m = D.MODUL[id];
    var k = D.KATEGORI[id];
    var jalur = document.getElementById("modul-jalur");
    if (jalur) jalur.style.width = "100%";

    var lencanaBaru = !Store.adaLencana(lencanaMap[id]);
    Store.modulSelesai(id);
    var misi1Baru = !!Store.dapat().misi.m1;

    var seterusnya = { jarak: "perasaan", perasaan: "pancaindera", pancaindera: null }[id];
    var el = document.getElementById("modul-kandungan");
    el.innerHTML = '<div class="kad" style="padding:clamp(28px,5vw,52px);text-align:center">' +
      '<div class="hasil-emoji-lingkar" style="margin:0 auto 18px;background:var(--' + id + '2);color:var(--' + id + ')">' + Ikon.iko("semakBulat", 42) + "</div>" +
      '<h2 style="margin:0;font-size:clamp(26px,4.5vw,38px);font-weight:800">Hebat! Kamu berjaya!</h2>' +
      '<p style="color:var(--dakwat2);margin:10px 0 0">Modul ' + m.tajuk + " selesai.</p>" +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">' +
      UI.chipKategori(id) +
      (misi1Baru ? '<span class="cip" style="background:var(--biru2);color:var(--biru-tua);border:none">' + Ikon.iko("kilat", 15) + " Misi 01 selesai · +40 XP</span>" : "") +
      (lencanaBaru ? '<span class="cip" style="background:var(--hijau2);color:var(--hijau);border:none">' + Ikon.iko("pingat", 15) + " Lencana dibuka!</span>" : "") +
      "</div>" +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px">' +
      '<a class="btn btn-ghost" href="#/belajar">' + Ikon.iko("buku", 17) + " Kembali ke Belajar</a>" +
      (seterusnya ? '<a class="btn btn-utama" href="#/modul/' + seterusnya + '">Modul Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</a>" : '<a class="btn btn-utama" href="#/misi">Lihat Misi ' + Ikon.iko("sasaran", 17) + "</a>") +
      "</div></div>";

    UI.konfeti(20);
    UI.kepalaXP();
    if (lencanaBaru) {
      AudioMesin.lencana();
      UI.toast("Lencana baharu dibuka!", "berjaya", "pingat");
    } else {
      AudioMesin.berjaya();
    }
    if (misi1Baru) {
      UI.toastXp(40);
      UI.toast("Misi 01 — Kenali selesai! +40 XP", "berjaya", "sasaran");
    }
  }

  return { init: init };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — AKTIVITI
   Misi 02: Sentuh & Pilih (visual + cerita)
   Misi 04: Drag & Drop kategori + Bina Ayat
   ============================================================ */
"use strict";

window.Aktiviti = (function () {
  var D = DataApp;

  /* ============================================================
     MISI 02 — SENTUH & PILIH
     ============================================================ */
  var sentuhIdx = 0;

  function sentuh() {
    sentuhIdx = 0;
    sentuhSoalan();
  }

  function sentuhSoalan() {
    var q = D.SENTUH[sentuhIdx];
    var el = document.getElementById("sentuh-kandungan");
    var media = mediaSentuh(q);
    var pilihan = q.pilihan.map(function (p) {
      return '<button class="cip-kata" data-pilih="' + p + '">' + p + "</button>";
    }).join("");

    el.innerHTML = '<div class="kad kad-soalan">' +
      '<div class="soalan-kepala"><span class="soalan-no">SOALAN ' + (sentuhIdx + 1) + " / " + D.SENTUH.length + "</span>" +
      UI.chipKategori(q.kategori) + "</div>" +
      '<p class="soalan-teks">' + q.soalan.replace("______", '<span class="slot">______</span>') + "</p>" +
      media +
      '<div class="pilihan">' + pilihan + "</div>" +
      '<div id="maklumSentuh" aria-live="polite"></div>' +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-dengar btn-sm" data-dengar="' + q.soalan + '" aria-label="Dengar soalan">' + Ikon.iko("pembesarSuara", 17) + " Dengar</button>" +
      '<button class="btn btn-utama" id="btnSeterusnya" disabled>Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</button></div></div>";

    var sudah = false;
    var betulPertama = null;
    el.querySelectorAll("[data-pilih]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (sudah) return;
        var p = b.getAttribute("data-pilih");
        if (p === q.jawab) {
          if (betulPertama === null) betulPertama = true;
          sudah = true;
          b.classList.add("betul");
          AudioMesin.berjaya();
          Store.catatStat(q.kategori, betulPertama);
          maklumSentuh(true, q);
          el.querySelector("#btnSeterusnya").disabled = false;
          el.querySelector("#btnSeterusnya").focus();
        } else {
          if (betulPertama === null) betulPertama = false;
          b.classList.add("salah");
          b.disabled = true;
          AudioMesin.gagal();
          maklumSentuh(false, q);
        }
      });
    });

    el.querySelector("#btnSeterusnya").addEventListener("click", function () {
      sentuhIdx++;
      if (sentuhIdx < D.SENTUH.length) sentuhSoalan();
      else sentuhSelesai();
    });
  }

  function mediaSentuh(q) {
    if (q.jenis === "jarak") {
      return '<div class="soalan-media" style="color:var(--jarak)">' + Ikon.jarakVisual(q.jarakNilai) + "</div>";
    }
    if (q.jenis === "wajah") {
      return '<div class="soalan-media" style="color:var(--perasaan)">' + Ikon.wajah(q.emosi) + "</div>";
    }
    return '<div class="soalan-media" style="color:var(--pancaindera)">' + Ikon.objek(q.objek) + "</div>";
  }

  function maklumSentuh(betul, q) {
    var el = document.getElementById("maklumSentuh");
    if (betul) {
      el.innerHTML = '<div class="maklum maklum-betul">' + Ikon.iko("semakBulat", 21) +
        '<div><strong>Hebat! Jawapan yang tepat ialah ' + q.jawab + '.</strong>' + q.penjelasan + "</div></div>";
    } else {
      el.innerHTML = '<div class="maklum maklum-salah">' + Ikon.iko("lampu", 21) +
        '<div><strong>Hampir betul! Cuba fikir semula.</strong>' +
        "Petunjuk: " + D.KATEGORI[q.kategori].desc + "</div></div>";
    }
  }

  function sentuhSelesai() {
    var el = document.getElementById("sentuh-kandungan");
    Store.misiSelesai("m2");
    el.innerHTML = kadSelesaiMisi(
      "Misi 02 Selesai!",
      "Kamu berjaya mengenal pasti kata adjektif berdasarkan visual dan cerita.",
      30, "#/misi/3", "Misi 03 — Gerakkan Tangan"
    );
    UI.konfeti(18);
    UI.kepalaXP();
    UI.toastXp(30);
    UI.toast("Misi 02 — Sentuh & Pilih selesai!", "berjaya", "sasaran");
    AudioMesin.lencana();
  }

  function kadSelesaiMisi(tajuk, sub, xp, laluan, namaSeterusnya) {
    return '<div class="kad" style="padding:clamp(28px,5vw,52px);text-align:center">' +
      '<div class="hasil-emoji-lingkar" style="margin:0 auto 18px">' + Ikon.iko("semakBulat", 42) + "</div>" +
      '<h2 style="margin:0;font-size:clamp(26px,4.5vw,38px);font-weight:800">' + tajuk + "</h2>" +
      '<p style="color:var(--dakwat2);margin:10px 0 0">' + sub + "</p>" +
      '<div style="display:flex;gap:10px;justify-content:center;margin-top:18px">' +
      '<span class="cip" style="background:var(--biru2);color:var(--biru-tua);border:none">' + Ikon.iko("kilat", 15) + " +" + xp + " XP</span></div>" +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px">' +
      '<a class="btn btn-ghost" href="#/misi">' + Ikon.iko("sasaran", 17) + " Semua Misi</a>" +
      '<a class="btn btn-utama" href="' + laluan + '">' + namaSeterusnya + " " + Ikon.iko("anakPanahKanan", 17) + "</a></div></div>";
  }

  /* ============================================================
     MISI 04 — AKTIVITI 1: DRAG & DROP
     ============================================================ */
  var dndTerpilih = null;
  var dndLetak = 0;

  function binaAyat() {
    dndTerpilih = null;
    dndLetak = 0;
    fasaDnd();
  }

  function fasaDnd() {
    var el = document.getElementById("bina-kandungan");
    var kad = UI.acak(D.DND.perkataan);

    var zon = ["jarak", "perasaan", "pancaindera"].map(function (id) {
      return '<div class="zon" data-kat="' + id + '" tabindex="0" role="group" aria-label="Kawasan ' + D.KATEGORI[id].label + '">' +
        '<div class="zon-kepala">' + UI.chipKategori(id) + '<span class="zon-kira">0</span></div>' +
        '<div class="zon-bekas"></div></div>';
    }).join("");

    var bank = kad.map(function (k) {
      return '<button class="kad-kata" data-kata="' + k.kata + '" data-kat="' + k.kategori + '">' + k.kata + "</button>";
    }).join("");

    el.innerHTML =
      '<div class="kad" style="padding:clamp(20px,4vw,34px)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">' +
      '<h3 style="margin:0;font-size:19px;font-weight:800">Aktiviti 1 — ' + D.DND.tajuk + "</h3>" +
      '<span class="cip">Aktiviti 1 / 2</span></div>' +
      '<div class="jalur" style="margin-bottom:16px"><div class="jalur-dalam" id="dndJalur" style="width:0%"></div></div>' +
      '<div class="petunjuk-dnd">' + Ikon.iko("gerak", 18) + "<span>" + D.DND.arahan + "</span></div>" +
      '<div class="dnd-grid">' + zon + "</div>" +
      '<div class="bank-kata" id="bankKata">' + bank + "</div>" +
      '<div id="dndMaklum" aria-live="polite"></div></div>';

    el.querySelectorAll(".kad-kata").forEach(wireKadKata);
    el.querySelectorAll(".zon").forEach(wireZon);

    document.getElementById("dndJalur").style.width = "0%";
  }

  function wireKadKata(kad) {
    var startX = 0, startY = 0, pindah = false, diseret = false;
    var pointerBaru = 0;

    function pilihAtauLepas() {
      /* mod ketik: pilih kad */
      UI.semua(".kad-kata").forEach(function (b) {
        var on = b === kad && !b.classList.contains("diletak");
        b.classList.toggle("terpilih", on);
        b.setAttribute("aria-pressed", String(on));
      });
      dndTerpilih = kad.classList.contains("terpilih") ? kad : null;
      AudioMesin.klik();
    }

    kad.addEventListener("pointerdown", function (e) {
      startX = e.clientX; startY = e.clientY;
      pindah = false; diseret = false;
      try { kad.setPointerCapture(e.pointerId); } catch (err) { /* abaikan */ }
      AudioMesin.bangunkan();
    });

    kad.addEventListener("pointermove", function (e) {
      if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
        diseret = true;
        if (!pindah) {
          pindah = true;
          kad.classList.add("diseret");
        }
      }
      UI.semua(".zon").forEach(function (z) {
        z.classList.toggle("terarah", !!diseret && z === zonDiBawah(e.clientX, e.clientY));
      });
    });

    kad.addEventListener("pointerup", function (e) {
      kad.classList.remove("diseret");
      UI.semua(".zon").forEach(function (z) { z.classList.remove("terarah"); });
      if (diseret) {
        var z = zonDiBawah(e.clientX, e.clientY);
        if (z) letakKad(kad, z);
      } else {
        pointerBaru = Date.now();
        pilihAtauLepas();
      }
    });

    /* Fallback click: papan kekunci, suis bantuan, screen reader */
    kad.addEventListener("click", function () {
      if (Date.now() - pointerBaru < 400) return; // sudah dikendali oleh pointer
      if (kad.classList.contains("diletak")) return;
      pilihAtauLepas();
    });

    kad.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        pointerBaru = Date.now(); // elak click berganda
        pilihAtauLepas();
      }
    });
  }

  function zonDiBawah(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    return el.closest ? el.closest(".zon") : null;
  }

  function wireZon(z) {
    z.addEventListener("click", function () {
      if (dndTerpilih) letakKad(dndTerpilih, z);
    });
    z.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && dndTerpilih) {
        e.preventDefault();
        letakKad(dndTerpilih, z);
      }
    });
  }

  function letakKad(kad, zon) {
    if (!kad || kad.classList.contains("diletak")) return;
    var kata = kad.getAttribute("data-kata");
    var katBetul = kad.getAttribute("data-kat");
    var katZon = zon.getAttribute("data-kat");
    var betul = katBetul === katZon;

    if (betul) {
      zon.querySelector(".zon-bekas").innerHTML +=
        '<div class="kad-serah betul">' + Ikon.iko("semak", 15) + kata + "</div>";
      kad.classList.add("diletak");
      kad.classList.remove("terpilih");
      dndTerpilih = null;
      dndLetak++;
      zon.querySelector(".zon-kira").textContent =
        String(zon.querySelectorAll(".kad-serah").length);
      document.getElementById("dndJalur").style.width = Math.round((dndLetak / 8) * 50) + "%";
      AudioMesin.berjaya();
      Store.catatStat(katBetul, true);
      if (dndLetak === 8) {
        setTimeout(fasaDndSelesai, 500);
      }
    } else {
      kad.classList.add("salah");
      AudioMesin.gagal();
      Store.catatStat(katBetul, false);
      var el = document.getElementById("dndMaklum");
      el.innerHTML = '<div class="maklum maklum-salah">' + Ikon.iko("lampu", 21) +
        '<div><strong>Belum tepat.</strong>' + kata + " ialah kata adjektif " + D.KATEGORI[katBetul].label.toLowerCase() + ". Cuba letakkan di kawasan yang betul.</div></div>";
      setTimeout(function () { kad.classList.remove("salah"); }, 600);
    }
  }

  function fasaDndSelesai() {
    var el = document.getElementById("bina-kandungan");
    el.innerHTML = '<div class="kad" style="padding:clamp(26px,4vw,44px);text-align:center">' +
      '<div class="hasil-emoji-lingkar" style="margin:0 auto 16px">' + Ikon.iko("semakBulat", 40) + "</div>" +
      '<h2 style="margin:0;font-size:clamp(24px,4vw,34px);font-weight:800">Semua Kata di Tempatnya!</h2>' +
      '<p style="color:var(--dakwat2);margin:10px 0 0">Hebat! Sekarang mari lengkapkan ayat.</p>' +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px">' +
      '<button class="btn btn-utama" id="btnKeAyat">' + Ikon.iko("pensel", 17) + " Aktiviti 2 — Bina Ayat</button></div></div>";
    document.getElementById("btnKeAyat").addEventListener("click", function () {
      dndTerpilih = null;
      ayatIdx = 0;
      fasaAyat();
    });
  }

  /* ============================================================
     MISI 04 — AKTIVITI 2: BINA AYAT
     ============================================================ */
  var ayatIdx = 0;

  function fasaAyat() {
    var q = D.AYAT[ayatIdx];
    var el = document.getElementById("bina-kandungan");
    var pilihan = q.pilihan.map(function (p) {
      return '<button class="cip-kata" data-pilih="' + p + '">' + p + "</button>";
    }).join("");

    el.innerHTML = '<div class="kad kad-soalan">' +
      '<div class="soalan-kepala"><span class="soalan-no">AYAT ' + (ayatIdx + 1) + " / " + D.AYAT.length + "</span>" +
      '<span class="cip">Aktiviti 2 / 2</span></div>' +
      '<div class="jalur" style="margin-bottom:20px"><div class="jalur-dalam" style="width:' + Math.round(50 + ((ayatIdx + 1) / D.AYAT.length) * 50) + '%"></div></div>' +
      '<p class="soalan-teks">' + q.ayat.replace("______", '<span class="slot">______</span>') + "</p>" +
      '<div class="pilihan">' + pilihan + "</div>" +
      '<div id="maklumAyat" aria-live="polite"></div>' +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-dengar btn-sm" data-dengar="' + q.ayat + '" aria-label="Dengar ayat">' + Ikon.iko("pembesarSuara", 17) + " Dengar</button>" +
      '<button class="btn btn-utama" id="btnSeterusnya" disabled>Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</button></div></div>";

    var sudah = false;
    var betulPertama = null;
    el.querySelectorAll("[data-pilih]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (sudah) return;
        var p = b.getAttribute("data-pilih");
        if (p === q.jawab) {
          if (betulPertama === null) betulPertama = true;
          sudah = true;
          b.classList.add("betul");
          AudioMesin.berjaya();
          var kat = katDariJawab(q);
          Store.catatStat(kat, betulPertama);
          document.getElementById("maklumAyat").innerHTML =
            '<div class="maklum maklum-betul">' + Ikon.iko("semakBulat", 21) +
            '<div><strong>Hebat! Ayat lengkap!</strong>' + q.ayat.replace("______", q.jawab) + "<br>" + q.penjelasan + "</div></div>";
          el.querySelector("#btnSeterusnya").disabled = false;
          el.querySelector("#btnSeterusnya").focus();
        } else {
          if (betulPertama === null) betulPertama = false;
          b.classList.add("salah");
          b.disabled = true;
          AudioMesin.gagal();
          document.getElementById("maklumAyat").innerHTML =
            '<div class="maklum maklum-salah">' + Ikon.iko("lampu", 21) +
            '<div><strong>Hampir betul! Cuba fikir semula.</strong>' + p + " tidak sesuai dalam ayat ini. Cuba perkataan lain.</div></div>";
        }
      });
    });

    el.querySelector("#btnSeterusnya").addEventListener("click", function () {
      ayatIdx++;
      if (ayatIdx < D.AYAT.length) fasaAyat();
      else fasaAyatSelesai();
    });
  }

  function katDariJawab(q) {
    var kat = "perasaan";
    for (var k in D.KATEGORI) {
      if (D.KATEGORI[k].kata.indexOf(q.jawab) !== -1) kat = k;
    }
    return kat;
  }

  function fasaAyatSelesai() {
    var el = document.getElementById("bina-kandungan");
    Store.misiSelesai("m4");
    el.innerHTML = kadSelesaiMisi(
      "Misi 04 Selesai!",
      "Kamu berjaya meletakkan kata ke tempatnya dan melengkapkan ayat dengan betul.",
      40, "#/misi/5", "Misi 05 — Cabaran Akhir"
    );
    UI.konfeti(20);
    UI.kepalaXP();
    UI.toastXp(40);
    UI.toast("Misi 04 — Bina Ayat selesai!", "berjaya", "sasaran");
    AudioMesin.lencana();
  }

  return { sentuh: sentuh, binaAyat: binaAyat };
})();

</script>
<script type="text/plain" id="ar-worker-source">
/* ============================================================
   KATA+ AR — PEKERJA PENGESAN TANGAN (MediaPipe Hand Landmarker)
   Pekerja klasik (BUKAN module): inferens di luar benang UI
   supaya animasi kekal lancar. 21 titik tangan dihantar balik.
   ============================================================ */
"use strict";

var landmarker = null;
var sibuk = false;

self.onmessage = async function (ev) {
  var m = ev.data;

  if (m.type === "init") {
    try {
      var vision = await import(m.wasmBundleUrl);
      var fileset = await vision.FilesetResolver.forVisionTasks(m.wasmDirUrl);
      var pilihan = {
        baseOptions: { modelAssetPath: m.modelUrl, delegate: "GPU" },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      };
      var delegateTerpakai = "GPU";
      try {
        landmarker = await vision.HandLandmarker.createFromOptions(fileset, pilihan);
      } catch (eGpu) {
        pilihan.baseOptions.delegate = "CPU";
        landmarker = await vision.HandLandmarker.createFromOptions(fileset, pilihan);
        delegateTerpakai = "CPU";
      }
      self.postMessage({ type: "sedia", delegate: delegateTerpakai });
    } catch (ralat) {
      self.postMessage({ type: "ralat", msg: String((ralat && ralat.message) || ralat) });
    }
    return;
  }

  if (m.type === "detect" && landmarker) {
    if (sibuk) { try { m.img.close(); } catch (e) { /* abaikan */ } return; }
    sibuk = true;
    try {
      var hasil = landmarker.detectForVideo(m.img, m.ts);
      var lm = hasil.landmarks && hasil.landmarks[0]
        ? hasil.landmarks[0].map(function (p) {
            return { x: p.x, y: p.y, v: typeof p.visibility === "number" ? p.visibility : 1 };
          })
        : null;
      self.postMessage({ type: "landmarks", id: m.id, lm: lm });
    } catch (e) {
      self.postMessage({ type: "landmarks", id: m.id, lm: null });
    } finally {
      if (m.img && typeof m.img.close === "function") m.img.close();
      sibuk = false;
    }
  }

  if (m.type === "tutup") {
    if (landmarker && typeof landmarker.close === "function") {
      try { landmarker.close(); } catch (e) { /* abaikan */ }
    }
    landmarker = null;
    self.close();
  }
};

</script>
<script>
/* ============================================================
   KATA+ AR — MISI 03: GERAKKAN TANGAN
   "Tangkap Kata Adjektif" — kamera + penjejakan tangan
   (MediaPipe Hand Landmarker, pemprosesan client-side sahaja).

   Gerak isyarat:
   - Menunjuk (tahan)  → pilih kad di bawah kursor
   - Cubit             → ambil kad di bawah kursor
   - Ibu jari ke atas  → sahkan / ambil kad
   - Tapak terbuka     → buka legenda kategori (genggam = tutup)
   - Angkat tangan     → petunjuk
   - Swipe kiri/kanan  → pusingan seterusnya / sebelumnya

   Mod Sentuh (fallback): ketik kad, seret untuk swipe,
   butang untuk legenda & petunjuk.
   ============================================================ */
"use strict";

window.Ar = (function () {
  var D = DataApp;

  var CDN = {
    bundle: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs",
    wasm: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm",
    model: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  };

  var sesi = null;

  /* Peta perkataan → kategori */
  var kataKeKat = {};
  (function () {
    for (var k in D.KATEGORI) {
      D.KATEGORI[k].kata.forEach(function (w) { kataKeKat[w.toLowerCase()] = k; });
    }
  })();

  function buka() {
    if (sesi) henti();
    var el = document.getElementById("ar-kandungan");
    var sokong = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    el.innerHTML = '<div class="kad ar-privasi">' +
      '<span class="privasi-iko">' + Ikon.iko("kamera", 36) + "</span>" +
      "<h2>KATA+ AR</h2>" +
      '<p style="margin:0;color:var(--dakwat2)">Kamera digunakan untuk mengesan pergerakan tangan kamu. Angkat tangan, tunjuk, dan tangkap kata adjektif!</p>' +
      '<div class="privasi-nota"><strong>' + Ikon.iko("perisai", 16) + " Privasi kamu dilindungi</strong>" +
      D.INFO.privasiPenuh + "</div>" +
      (sokong ? "" : '<div class="privasi-nota" style="background:var(--ambar2);border-color:rgba(184,121,26,0.35);color:#7c510c">Kamera tidak tersedia pada peranti atau pelayar ini. Kamu boleh bermain dengan Mod Sentuh.</div>') +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">' +
      (sokong ? '<button class="btn btn-utama btn-lg" id="btnKamera">' + Ikon.iko("kamera", 19) + " Benarkan Kamera</button>" : "") +
      '<button class="btn ' + (sokong ? "btn-ghost" : "btn-utama") + ' btn-lg" id="btnSentuh">' + Ikon.iko("tangan", 19) + " Guna Touch Mode</button></div>" +
      '<button class="btn btn-dengar btn-sm" data-cara-ar>Cara Bermain AR</button>' +
      "</div>";

    document.getElementById("btnSentuh").addEventListener("click", function () { mula("sentuh"); });
    var bk = document.getElementById("btnKamera");
    if (bk) bk.addEventListener("click", function () { mula("kamera"); });
    var bca = el.querySelector("[data-cara-ar]");
    if (bca) bca.addEventListener("click", function () { Screens.caraBermainModal(); });
  }

  /* ============================================================
     MEMULAKAN SESI
     ============================================================ */
  function mula(mod) {
    var el = document.getElementById("ar-kandungan");
    var pemain = {
      mod: mod,
      pusingan: 0,
      ditangkap: [],
      selesaiSemua: false,
      peralihanPusingan: false,
      hintCd: 0,
      stream: null,
      video: null,
      pengesan: null,
      pekerja: null,
      langsung: null,
      raf: 0,
      bingkai: 0,
      terakhir: 0,
      // gerak
      kursorAda: false, kursorX: 0, kursorY: 0,
      pelicin: { ada: false, x: 0, y: 0 },
      dwellEl: null, dwellT: 0,
      cubit: null, // pengesan cubit dengan histeresis
      gerakAktif: null,
      baselineY: null,
      angkatCd: 0,
      swipHist: [],
      swipCd: 0,
      tapakBuka: false,
      peralihan: null // 'memuat' | 'sedia' | 'gagal'
    };
    sesi = pemain;
    Store.set("arPernah", true);
    if (mod === "kamera") Store.set("arKamera", true);

    binaPentas(pemain);

    if (mod === "kamera") {
      pemain.peralihan = "memuat";
      pemain.status.textContent = "Memuat model pengesanan tangan... (kali pertama perlukan internet)";
      mulaStream(pemain);
    } else {
      pemain.peralihan = "sedia";
      pemain.status.textContent = "Mod Sentuh — ketik kad untuk menangkap. Seret untuk swipe.";
    }
  }

  function mulaStream(pemain) {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    }).then(function (stream) {
      pemain.stream = stream;
      pemain.video.srcObject = stream;
      pemain.video.classList.remove("tersembunyi");
      return pemain.video.play();
    }).then(function () {
      return buatPengesan(pemain);
    }).then(function (api) {
      pemain.pengesan = api;
      pemain.peralihan = "sedia";
      pemain.status.textContent = "Angkat tangan ke hadapan kamera. Tunjuk ke kad dan tahan sebentar.";
      gelung(pemain);
    }).catch(function (e) {
      gagalKamera(pemain, e);
    });
  }

  function gagalKamera(pemain, e) {
    var nama = (e && e.name) || "";
    var msg;
    if (nama === "NotAllowedError" || nama === "PermissionDeniedError") {
      msg = "Akses kamera dinafikan. Kamu boleh bermain dengan Mod Sentuh — semua aktiviti tetap boleh diselesaikan.";
    } else if (nama === "NotFoundError" || nama === "OverconstrainedError") {
      msg = "Kamera tidak dijumpai pada peranti ini. Kamu boleh bermain dengan Mod Sentuh.";
    } else if (pemain.pengesan === null && !pemain.stream) {
      msg = "Kamera tidak dapat dibuka. Kamu boleh bermain dengan Mod Sentuh.";
    } else {
      msg = "Model pengesanan tangan gagal dimuat (perlukan internet untuk kali pertama). Kamu boleh bermain dengan Mod Sentuh.";
    }
    henti(pemain);
    UI.toast(msg, "ralat", "maklumat");
    setTimeout(function () { mula("sentuh"); }, 700);
  }

  /* ============================================================
     PENGESAN TANGAN — pekerja klasik dahulu, benang utama
     sebagai gantian (cth. file:// menyekat pekerja).
     ============================================================ */
  function urlPekerja() {
    var terbenam = document.getElementById("ar-worker-source");
    if (terbenam && window.Blob && window.URL && URL.createObjectURL) {
      return URL.createObjectURL(new Blob([terbenam.textContent], { type: "text/javascript" }));
    }
    return "js/ar-worker.js";
  }

  function buatPengesan(pemain) {
    return new Promise(function (resolve, reject) {
      var pekerja = null;
      var sumberPekerja = urlPekerja();
      var blobPekerja = sumberPekerja.indexOf("blob:") === 0;
      try {
        pekerja = new Worker(sumberPekerja);
        if (blobPekerja) pemain.pekerjaUrl = sumberPekerja;
      } catch (eW) {
        pekerja = null;
        if (blobPekerja) URL.revokeObjectURL(sumberPekerja);
      }
      if (pekerja) {
        var siap = false;
        pekerja.onmessage = function (ev) {
          var m = ev.data;
          if (m.type === "sedia") {
            siap = true;
            pemain.pekerja = pekerja;
            resolve({
              jenis: "pekerja",
              detect: function (img, ts, cb) {
                pemain.bingkai++;
                pekerja.postMessage({ type: "detect", id: pemain.bingkai, img: img, ts: ts }, [img]);
                pemain.lastId = pemain.bingkai;
                cbLangsung = cb;
              }
            });
          } else if (m.type === "ralat") {
            pekerja.terminate();
            reject(new Error(m.msg));
          } else if (m.type === "landmarks" && siap) {
            if (m.id === pemain.lastId && cbLangsung) cbLangsung(m.lm);
          }
        };
        var cbLangsung = null;
        pekerja.onerror = function () {
          try { pekerja.terminate(); } catch (e2) { /* abaikan */ }
          pekerja = null;
          reject(new Error("pekerja gagal"));
        };
        pekerja.postMessage({
          type: "init", wasmBundleUrl: CDN.bundle, wasmDirUrl: CDN.wasm, modelUrl: CDN.model
        });
        setTimeout(function () {
          if (!siap && pekerja) {
            try { pekerja.terminate(); } catch (e3) { /* abaikan */ }
            reject(new Error("masa tamat"));
          }
        }, 30000);
        return;
      }
      /* Gantian: inferens pada benang utama */
      import(CDN.bundle).then(function (vision) {
        return vision.FilesetResolver.forVisionTasks(CDN.wasm).then(function (fileset) {
          var pilihan = {
            baseOptions: { modelAssetPath: CDN.model, delegate: "GPU" },
            runningMode: "VIDEO",
            numHands: 1,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5
          };
          return vision.HandLandmarker.createFromOptions(fileset, pilihan).catch(function () {
            pilihan.baseOptions.delegate = "CPU";
            return vision.HandLandmarker.createFromOptions(fileset, pilihan);
          });
        });
      }).then(function (landmarker) {
        pemain.langsung = landmarker;
        resolve({
          jenis: "langsung",
          detect: function (img, ts, cb) {
            var hasil = landmarker.detectForVideo(img, ts);
            cb(hasil.landmarks && hasil.landmarks[0]
              ? hasil.landmarks[0].map(function (p) { return { x: p.x, y: p.y, v: p.visibility || 1 }; })
              : null);
          }
        });
      }).catch(function (e) { reject(e); });
    });
  }

  /* ============================================================
     BINA PENTAS PERMAINAN
     ============================================================ */
  function binaPentas(pemain) {
    var el = document.getElementById("ar-kandungan");
    el.innerHTML =
      '<div class="ar-pentas" id="arPentas">' +
      '<video class="ar-video tersembunyi" id="arVideo" autoplay playsinline muted aria-hidden="true"></video>' +
      '<div class="ar-lapisan">' +
      '<div class="ar-bar-atas">' +
      '<div class="ar-arahan" id="arArahan"></div>' +
      '<span class="ar-cip-status" id="arStatus"></span>' +
      '<button class="btn-iko" id="arHint" aria-label="Petunjuk" title="Petunjuk">' + Ikon.iko("lampu", 19) + "</button>" +
      '<button class="btn-iko" id="arLegenda" aria-label="Legenda kategori" title="Legenda kategori">' + Ikon.iko("maklumat", 19) + "</button>" +
      (pemain.mod === "kamera" ? '<button class="btn-iko" id="arHenti" aria-label="Matikan kamera" title="Matikan kamera">' + Ikon.iko("pembesarSuaraX", 19) + "</button>" : "") +
      "</div>" +
      '<div class="ar-ruang" id="arRuang">' +
      '<div class="ar-hint" id="arHintPanel" hidden></div>' +
      '<div class="ar-legenda-kat" id="arLegendaPanel" hidden></div>' +
      '<span class="ar-kursor" id="arKursor" aria-hidden="true"></span>' +
      "</div>" +
      '<div class="ar-bar-bawah">' +
      '<div class="ar-tray"><span class="ar-tray-label">Ditangkap</span><span id="arTrayKata"></span></div>' +
      '<div class="ar-titik" id="arTitik" role="progressbar" aria-label="Pusingan"></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn btn-ghost btn-sm" id="arSebelum" aria-label="Pusingan sebelumnya">' + Ikon.iko("anakPanahKiri", 16) + "</button>" +
      '<button class="btn btn-ghost btn-sm" id="arSelepas" aria-label="Pusingan seterusnya">' + Ikon.iko("anakPanahKanan", 16) + "</button></div></div></div></div>";

    pemain.video = document.getElementById("arVideo");
    pemain.ruang = document.getElementById("arRuang");
    pemain.kursor = document.getElementById("arKursor");
    pemain.status = document.getElementById("arStatus");
    pemain.arahan = document.getElementById("arArahan");
    pemain.hintPanel = document.getElementById("arHintPanel");
    pemain.legendaPanel = document.getElementById("arLegendaPanel");
    pemain.titik = document.getElementById("arTitik");
    pemain.tray = document.getElementById("arTrayKata");

    document.getElementById("arHint").addEventListener("click", function () { paparPetunjuk(pemain); });
    document.getElementById("arLegenda").addEventListener("click", function () { togolLegenda(pemain); });
    document.getElementById("arSebelum").addEventListener("click", function () { tukarPusingan(pemain, -1); });
    document.getElementById("arSelepas").addEventListener("click", function () { tukarPusingan(pemain, 1); });
    var btnHenti = document.getElementById("arHenti");
    if (btnHenti) btnHenti.addEventListener("click", function () {
      henti(pemain);
      UI.toast("Kamera dimatikan. Beralih ke Mod Sentuh.", "info", "maklumat");
      mula("sentuh");
    });

    /* Swipe sentuh pada ruang */
    var sx = 0, sy = 0, st = 0;
    pemain.ruang.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; st = Date.now(); });
    pemain.ruang.addEventListener("pointerup", function (e) {
      var dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - st;
      if (Math.abs(dx) > 70 && Math.abs(dy) < 70 && dt < 700) {
        AudioMesin.sapu();
        tukarPusingan(pemain, dx < 0 ? 1 : -1);
      }
    });

    renderPusingan(pemain);
  }

  /* ============================================================
     PUSINGAN
     ============================================================ */
  function renderPusingan(pemain) {
    var r = D.AR.pusingan[pemain.pusingan];
    pemain.ditangkap = [];
    pemain.dwellEl = null;
    pemain.dwellT = 0;
    pemain.tapakBuka = false;

    var kat = D.KATEGORI[r.kategori];
    pemain.arahan.innerHTML = "<strong>Cari kata adjektif " + kat.label.toUpperCase() + ".</strong>" +
      "<span>" + kat.desc + "</span>";

    /* titik kemajuan pusingan */
    pemain.titik.innerHTML = D.AR.pusingan.map(function (p, i) {
      return '<i class="' + (i === pemain.pusingan ? "aktif" : (i < pemain.pusingan ? "siap" : "")) + '" aria-hidden="true"></i>';
    }).join("");
    pemain.titik.setAttribute("aria-label", "Pusingan " + (pemain.pusingan + 1) + " daripada " + D.AR.pusingan.length);
    pemain.tray.innerHTML = "";
    pemain.hintPanel.hidden = true;
    pemain.legendaPanel.hidden = true;

    /* kedudukan kad */
    var slot = [[13, 20], [45, 11], [77, 22], [15, 63], [49, 72], [79, 57]];
    var susunan = UI.acak(r.kad.map(function (k, i) { return { kata: k, i: i }; }));

    var html = susunan.map(function (x, n) {
      var s = slot[n % slot.length];
      var kiri = Math.max(4, Math.min(72, s[0] + (Math.random() * 6 - 3)));
      var atas = Math.max(6, Math.min(62, s[1] + (Math.random() * 6 - 3)));
      return '<button class="ar-kad" data-ar-kata="' + x.kata + '" style="left:' + kiri + '%;top:' + atas + '%">' + x.kata + "</button>";
    }).join("");
    pemain.ruang.querySelectorAll(".ar-kad").forEach(function (k) { k.remove(); });
    pemain.ruang.insertAdjacentHTML("afterbegin", html);

    pemain.ruang.querySelectorAll(".ar-kad").forEach(function (k) {
      k.addEventListener("click", function () { pilihKad(pemain, k); });
    });

    if (pemain.mod === "kamera" && pemain.peralihan !== "sedia") {
      pemain.status.textContent = "Memuat model pengesanan tangan...";
    }
  }

  function tukarPusingan(pemain, arah) {
    var baru = pemain.pusingan + arah;
    if (baru < 0 || baru >= D.AR.pusingan.length || pemain.selesaiSemua || pemain.peralihanPusingan) return;
    pemain.pusingan = baru;
    renderPusingan(pemain);
    AudioMesin.klik();
  }

  function pilihKad(pemain, kad) {
    var r = D.AR.pusingan[pemain.pusingan];
    var kata = kad.getAttribute("data-ar-kata");
    if (pemain.ditangkap.indexOf(kata) !== -1 || pemain.selesaiSemua || pemain.peralihanPusingan) return;

    var betul = r.sasaran.indexOf(kata) !== -1;
    var kat = kataKeKat[kata.toLowerCase()] || r.kategori;

    if (betul) {
      pemain.ditangkap.push(kata);
      kad.classList.add("betul");
      AudioMesin.tangkap();
      Store.catatStat(r.kategori, true);
      setTimeout(function () {
        kad.classList.add("ditangkap");
        setTimeout(function () {
          if (!kad.parentNode) return;
          kad.remove();
          pemain.tray.innerHTML += '<span class="tray-kata">' + kata + "</span>";
        }, 380);
      }, 260);
      if (pemain.ditangkap.length === r.sasaran.length) {
        pusinganSelesai(pemain);
      }
    } else {
      kad.classList.add("salah");
      AudioMesin.gagal();
      Store.catatStat(r.kategori, false);
      paparPetunjuk(pemain, kata, r);
      setTimeout(function () { kad.classList.remove("salah"); }, 650);
    }
  }

  function pusinganSelesai(pemain) {
    if (pemain.peralihanPusingan || pemain.selesaiSemua) return;
    pemain.peralihanPusingan = true;

    var pusinganAkhir = pemain.pusingan === D.AR.pusingan.length - 1;
    var r = D.AR.pusingan[pemain.pusingan];
    var namaKat = D.KATEGORI[r.kategori].label;
    var lapis = document.createElement("div");
    lapis.className = "ar-selesai";
    lapis.setAttribute("role", "region");
    lapis.setAttribute("aria-live", "polite");
    lapis.setAttribute("aria-label", pusinganAkhir ? "Pusingan akhir selesai" : "Pusingan selesai");
    lapis.style.background = "rgba(255,255,255,0.92)";
    var arahanSambung = pusinganAkhir
      ? "Tekan butang untuk melihat keputusan."
      : "Tekan butang apabila kamu bersedia. Pusingan tidak akan berubah sendiri.";
    lapis.innerHTML =
      '<div class="hasil-emoji-lingkar" style="margin:0;background:var(--hijau2);color:var(--hijau)">' + Ikon.iko("semakBulat", 38) + "</div>" +
      "<h2>" + (pusinganAkhir ? "Pusingan Akhir Selesai!" : "Pusingan " + (pemain.pusingan + 1) + " selesai!") + "</h2>" +
      "<p>Semua kata adjektif " + namaKat + " berjaya ditangkap. " + arahanSambung + "</p>" +
      '<button class="btn btn-utama btn-lg" id="btnArSambung">' +
      (pusinganAkhir ? "Tamatkan Misi" : "Pusingan Seterusnya") + " " + Ikon.iko(pusinganAkhir ? "semakBulat" : "anakPanahKanan", 18) +
      "</button>";
    pemain.ruang.appendChild(lapis);

    var btn = lapis.querySelector("#btnArSambung");
    btn.addEventListener("click", function () {
      lapis.remove();
      AudioMesin.klik();
      if (pusinganAkhir) {
        tamat(pemain);
      } else {
        pemain.pusingan++;
        pemain.peralihanPusingan = false;
        renderPusingan(pemain);
      }
    });
    btn.focus();
  }

  function tamat(pemain) {
    pemain.selesaiSemua = true;
    var st = Store.dapat();
    Store.misiSelesai("m3");
    var xp = D.XP.misi3;

    var lapis = document.createElement("div");
    lapis.className = "ar-selesai";
    lapis.innerHTML =
      '<div class="hasil-emoji-lingkar" style="margin:0">' + Ikon.iko("semakBulat", 42) + "</div>" +
      "<h2>Hebat! Semua Kata Ditangkap!</h2>" +
      "<p>Kamu berjaya menyelesaikan Misi 03 dengan " + (pemain.mod === "kamera" ? "gerakan tangan" : "Mod Sentuh") + ".</p>" +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<span class="cip" style="background:var(--biru2);color:var(--biru-tua);border:none">' + Ikon.iko("kilat", 15) + " +" + xp + " XP</span></div>" +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">' +
      '<a class="btn btn-ghost" href="#/misi">' + Ikon.iko("sasaran", 17) + " Semua Misi</a>" +
      '<a class="btn btn-utama" href="#/misi/4">Misi 04 — Bina Ayat ' + Ikon.iko("anakPanahKanan", 17) + "</a></div>";
    pemain.ruang.appendChild(lapis);

    henti(pemain, true);
    UI.konfeti(20);
    UI.kepalaXP();
    UI.toastXp(xp);
    UI.toast("Misi 03 — Gerakkan Tangan selesai!", "berjaya", "kamera");
    AudioMesin.lencana();
  }

  function paparPetunjuk(pemain, kataSalah, r) {
    var now = Date.now();
    if (now - pemain.hintCd < 6000 && !kataSalah) return;
    pemain.hintCd = now;
    AudioMesin.petunjuk();
    var teks;
    if (kataSalah && r) {
      var katSalah = kataKeKat[kataSalah.toLowerCase()];
      teks = "Kata itu ialah kata adjektif " + (katSalah ? D.KATEGORI[katSalah].label : "lain") + ". Cuba cari kata adjektif " + D.KATEGORI[r.kategori].label + ".";
    } else {
      teks = D.AR.hintKat[D.AR.pusingan[pemain.pusingan].kategori];
    }
    pemain.hintPanel.innerHTML = Ikon.iko("lampu", 19) + "<span>" + teks + "</span>";
    pemain.hintPanel.hidden = false;
    clearTimeout(pemain.hintTimer);
    pemain.hintTimer = setTimeout(function () { pemain.hintPanel.hidden = true; }, 4200);
  }

  function togolLegenda(pemain) {
    var r = D.AR.pusingan[pemain.pusingan];
    if (pemain.legendaPanel.hidden) {
      pemain.legendaPanel.innerHTML = ["jarak", "perasaan", "pancaindera"].map(function (id) {
        var k = D.KATEGORI[id];
        return '<span class="cip cip-kat ' + id + '">' + Ikon.iko(k.ikon, 15) + k.label + "</span>";
      }).join("") +
        '<span style="flex-basis:100%;font-size:13.5px;color:var(--dakwat2)">Sasaran sekarang: ' + D.KATEGORI[r.kategori].label + "</span>";
      pemain.legendaPanel.hidden = false;
    } else {
      pemain.legendaPanel.hidden = true;
    }
  }

  /* ============================================================
     GELUNG KAMERA & GERAK ISYARAT
     ============================================================ */
  function gelung(pemain) {
    function langkah() {
      if (!sesi || sesi !== pemain) return;
      pemain.raf = requestAnimationFrame(langkah);
      var now = performance.now();

      if (pemain.pengesan && pemain.video && pemain.video.readyState >= 2) {
        var langkau = pemain.pengesan.jenis === "langsung" ? 66 : 33;
        if (now - pemain.terakhir >= langkau) {
          pemain.terakhir = now;
          try {
            var img = createImageBitmap(pemain.video, { resizeWidth: 320 });
            img.then(function (bm) {
              if (!sesi || sesi !== pemain) { bm.close(); return; }
              pemain.pengesan.detect(bm, now, function (lm) { prosesLandmark(pemain, lm); });
            }).catch(function () { /* abaikan */ });
          } catch (e2) { /* abaikan */ }
        }
      }

      /* kursor idle */
      if (now - pemain.terakhirKursor > 3000 && pemain.kursor.style.display !== "none") {
        pemain.kursor.style.display = "none";
        pemain.status.textContent = "Angkat tangan ke hadapan kamera.";
      }
    }
    pemain.raf = requestAnimationFrame(langkah);
  }

  function prosesLandmark(pemain, lm) {
    if (!lm) return;
    var gerak = klasifikasi(lm, pemain);

    /* kursor: hujung telunjuk (8) atau tapak tangan (9) */
    var titik = gerak === "telunjuk" ? lm[8] : lm[9];
    var p = unjur(pemain, titik.x, titik.y);
    pemain.terakhirKursor = performance.now();
    pemain.kursor.style.display = "block";
    pemain.kursor.style.left = p.x + "px";
    pemain.kursor.style.top = p.y + "px";
    pemain.kursor.classList.toggle("mengisi", !!pemain.dwellEl);

    /* status chip */
    if (gerak !== pemain.gerakAktif) {
      pemain.gerakAktif = gerak;
      pemain.status.textContent = teksGerak(gerak);
    }

    /* Swipe yang disengajakan: tapak terbuka, sapuan mendatar pantas. */
    var t = performance.now();
    if (gerak === "tapak" && !pemain.peralihanPusingan) {
      pemain.swipHist.push({ x: lm[0].x, y: lm[0].y, t: t });
      while (pemain.swipHist.length && t - pemain.swipHist[0].t > 420) pemain.swipHist.shift();
      if (pemain.swipHist.length > 4 && t - pemain.swipCd > 1000) {
        var mulaSwipe = pemain.swipHist[0];
        var dx = lm[0].x - mulaSwipe.x;
        var dy = lm[0].y - mulaSwipe.y;
        var durasi = t - mulaSwipe.t;
        if (Math.abs(dx) > 0.32 && Math.abs(dy) < 0.14 && durasi >= 100 && durasi <= 420) {
          pemain.swipCd = t;
          pemain.swipHist = [];
          AudioMesin.sapu();
          tukarPusingan(pemain, dx < 0 ? 1 : -1);
          return;
        }
      }
    } else {
      pemain.swipHist = [];
    }

    /* Angkat tangan → petunjuk */
    var y = lm[0].y;
    if (pemain.baselineY === null) pemain.baselineY = y;
    pemain.baselineY = Math.min(pemain.baselineY * 1.0006, y);
    if (y < pemain.baselineY - 0.2 && t - pemain.angkatCd > 5000) {
      pemain.angkatCd = t;
      paparPetunjuk(pemain);
    }

    /* Tapak terbuka → legenda; genggam → tutup */
    if (gerak === "tapak" && !pemain.tapakBuka) {
      pemain.tapakBuka = true;
      if (pemain.legendaPanel.hidden) togolLegenda(pemain);
    }
    if (gerak === "genggam" && pemain.tapakBuka) {
      pemain.tapakBuka = false;
      pemain.legendaPanel.hidden = true;
    }

    /* Pilih kad: menunjuk tahan (dwell), cubit atau ibu jari */
    var kad = kadDiKursor(pemain, p);
    if (kad !== pemain.dwellEl) { pemain.dwellEl = kad; pemain.dwellT = performance.now(); }
    if (kad) {
      pemain.ruang.querySelectorAll(".ar-kad").forEach(function (k) {
        k.classList.toggle("dituju", k === kad);
      });
    }

    var lamaTunjuk = kad && performance.now() - pemain.dwellT > 650;
    var cubit = gerak === "cubit";
    var ibu = gerak === "ibuJari";
    if (kad && (lamaTunjuk || cubit || ibu)) {
      pemain.dwellEl = null;
      pemain.dwellT = 0;
      pilihKad(pemain, kad);
    }
  }

  function teksGerak(g) {
    var m = {
      tapak: "Tapak tangan terbuka — legenda kategori dibuka",
      telunjuk: "Menunjuk — tahan di atas kad untuk memilih",
      cubit: "Cubit dikesan — kad diambil",
      ibuJari: "Ibu jari ke atas — jawapan disahkan",
      genggam: "Genggaman — legenda ditutup",
      null: "Angkat tangan ke hadapan kamera"
    };
    return m[g] || m.null;
  }

  function kadDiKursor(pemain, p) {
    var kad = pemain.ruang.querySelectorAll(".ar-kad");
    var r = pemain.ruang.getBoundingClientRect();
    for (var i = 0; i < kad.length; i++) {
      var b = kad[i].getBoundingClientRect();
      if (p.x >= b.left - r.left && p.x <= b.right - r.left && p.y >= b.top - r.top && p.y <= b.bottom - r.top) {
        return kad[i];
      }
    }
    return null;
  }

  function unjur(pemain, x, y) {
    var ruang = pemain.ruang.getBoundingClientRect();
    var vw = pemain.video.videoWidth || 640;
    var vh = pemain.video.videoHeight || 480;
    var px = 1 - x; // cermin paksi-X
    var skala = Math.max(ruang.width / vw, ruang.height / vh);
    var lebarLukis = vw * skala;
    var tinggiLukis = vh * skala;
    return {
      x: px * lebarLukis + (ruang.width - lebarLukis) / 2,
      y: y * tinggiLukis + (ruang.height - tinggiLukis) / 2
    };
  }

  /* ---------- KLASIFIKASI GERAK ISYARAT ---------- */
  function jarak2(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function lanjut(lm, tip, pip, mcp) {
    if (Math.min(lm[tip].v, lm[pip].v, lm[mcp].v) < 0.35) return false;
    var d1 = jarak2(lm[tip], lm[mcp]);
    var d2 = jarak2(lm[pip], lm[mcp]);
    return d1 > d2 * 1.25;
  }

  function klasifikasi(lm, pemain) {
    var f2 = lanjut(lm, 8, 6, 5);
    var f3 = lanjut(lm, 12, 10, 9);
    var f4 = lanjut(lm, 16, 14, 13);
    var f5 = lanjut(lm, 20, 18, 17);
    var ibuKeluar = jarak2(lm[4], lm[5]) > jarak2(lm[3], lm[5]) * 1.2;
    var semuaLipat = !f2 && !f3 && !f4 && !f5;

    /* Cubit: nisbah jarak ibu jari–telunjuk berbanding saiz tapak */
    var d = jarak2(lm[4], lm[8]);
    var tapak = Math.max(jarak2(lm[0], lm[9]), 0.001);
    var nisbah = d / tapak;
    if (!pemain.cubit) pemain.cubit = { dalam: false };
    if (!pemain.cubit.dalam && nisbah < 0.55) pemain.cubit.dalam = true;
    else if (pemain.cubit.dalam && nisbah > 0.82) pemain.cubit.dalam = false;

    if (semuaLipat && nisbah < 0.75) return "genggam";
    if (pemain.cubit.dalam && !semuaLipat) return "cubit";
    if (semuaLipat && lm[4].v > 0.35 && lm[4].y < lm[2].y - 0.02) return "ibuJari";
    if (f2 && f3 && f4 && f5 && ibuKeluar) return "tapak";
    if (f2 && !f3 && !f4 && !f5) return "telunjuk";
    return null;
  }

  /* ============================================================
     HENTI
     ============================================================ */
  function henti(pemain, biarLapis) {
    var p = pemain || sesi;
    if (!p) return;
    if (p.raf) cancelAnimationFrame(p.raf);
    if (p.stream) {
      p.stream.getTracks().forEach(function (t) { t.stop(); });
    }
    if (p.pekerja) {
      try { p.pekerja.postMessage({ type: "tutup" }); } catch (e) { /* abaikan */ }
      p.pekerja = null;
    }
    if (p.pekerjaUrl) {
      try { URL.revokeObjectURL(p.pekerjaUrl); } catch (e) { /* abaikan */ }
      p.pekerjaUrl = null;
    }
    if (p.langsung && typeof p.langsung.close === "function") {
      try { p.langsung.close(); } catch (e) { /* abaikan */ }
      p.langsung = null;
    }
    if (sesi === p) sesi = null;
  }

  window.addEventListener("hashchange", function () { henti(); });

  return { buka: buka, henti: henti };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — MISI 05: CABARAN AKHIR
   10 soalan, 6 jenis: pilihan berganda, drag & drop,
   imej, ayat, isyarat tangan, audio.
   ============================================================ */
"use strict";

window.Kuiz = (function () {
  var D = DataApp;
  var idx = 0;
  var skor = { betul: 0, kat: { jarak: { b: 0, t: 0 }, perasaan: { b: 0, t: 0 }, pancaindera: { b: 0, t: 0 } } };

  var labelJenis = {
    mcq: ["senarai", "Pilihan Berganda"],
    dnd: ["gerak", "Drag & Drop"],
    imej: ["mata", "Soalan Bergambar"],
    ayat: ["pensel", "Lengkapkan Ayat"],
    isyarat: ["tangan", "Isyarat Tangan"],
    audio: ["fonKepala", "Soalan Audio"]
  };

  function buka() {
    idx = 0;
    skor = { betul: 0, kat: { jarak: { b: 0, t: 0 }, perasaan: { b: 0, t: 0 }, pancaindera: { b: 0, t: 0 } } };
    intro();
  }

  function intro() {
    var el = document.getElementById("kuiz-kandungan");
    el.innerHTML = '<div class="kad" style="padding:clamp(28px,5vw,48px);text-align:center">' +
      '<div class="hasil-emoji-lingkar" style="margin:0 auto 18px;background:var(--biru2);color:var(--biru)">' + Ikon.iko("trofi", 40) + "</div>" +
      '<h2 style="margin:0;font-size:clamp(26px,4.5vw,38px);font-weight:800">Cabaran Akhir</h2>' +
      '<p style="color:var(--dakwat2);margin:10px auto 0;max-width:44ch">10 soalan yang menggabungkan semua jenis kata adjektif: pilihan berganda, drag & drop, gambar, ayat, isyarat tangan dan audio. Tiada had masa — jawab dengan tenang.</p>' +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px">' +
      '<button class="btn btn-utama btn-lg" id="btnMulaKuiz">' + Ikon.iko("play", 18) + " Mula Cabaran</button></div></div>";
    document.getElementById("btnMulaKuiz").addEventListener("click", function () {
      AudioMesin.klik();
      soalan();
    });
  }

  function dots() {
    var s = "";
    for (var i = 0; i < D.KUIZ.length; i++) {
      var cls = i < idx ? "selesai" : (i === idx ? "aktif" : "");
      s += '<i class="' + cls + '" aria-hidden="true"></i>';
    }
    return '<div class="kuiz-dots" role="progressbar" aria-valuenow="' + (idx + 1) + '" aria-valuemax="' + D.KUIZ.length + '" aria-label="Soalan ' + (idx + 1) + ' daripada ' + D.KUIZ.length + '">' + s + "</div>";
  }

  function jenisBadge(q) {
    var l = labelJenis[q.jenis] || ["soalan", q.jenis];
    return '<span class="jenis-badge">' + Ikon.iko(l[0], 15) + l[1] + "</span>";
  }

  function media(q, akar) {
    var m = q.media;
    if (!m) return "";
    if (m.jenis === "jarak") {
      return '<div class="soalan-media" style="color:var(--jarak)">' + Ikon.jarakVisual(m.jarakNilai) + "</div>";
    }
    if (m.jenis === "objek") {
      return '<div class="soalan-media" style="color:var(--pancaindera)">' + Ikon.objek(m.objek) + "</div>";
    }
    if (m.jenis === "wajah") {
      return '<div class="soalan-media" style="color:var(--perasaan)">' + Ikon.wajah(m.emosi) + "</div>";
    }
    if (m.jenis === "audio") {
      return '<div class="soalan-media kuiz-media" style="color:var(--pancaindera)">' +
        '<button class="btn btn-utama" data-main-audio="' + m.audio + '">' + Ikon.iko("fonKepala", 18) + " Dengar Bunyi</button>" +
        '<button class="btn-dengar" data-main-audio="' + m.audio + '" aria-label="Ulang bunyi">' + Ikon.iko("ulang", 19) + "</button></div>";
    }
    if (m.jenis === "isyarat") {
      var kad = m.kad.map(function (k, i) {
        var ditunjuk = i === m.tunjuk;
        return '<div class="kad-tunjuk ' + (ditunjuk ? "" : "gelap") + '" data-pilih="' + k + '">' + k + "</div>";
      }).join("");
      return '<div class="soalan-media" style="flex-direction:column;gap:8px">' +
        '<span style="font-size:13.5px;font-weight:700;color:var(--dakwat3)">' + Ikon.iko("tangan", 15) + " Gerak isyarat: menunjuk</span>" +
        '<div class="isyarat-soalan">' +
        '<svg class="tangan-tunjuk" viewBox="0 0 24 24" fill="none" stroke="var(--biru)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="18.5" r="3.4"/><path d="M9 15V7.2"/><path d="m6.2 10.2 2.8-3 2.8 3"/><path d="M9 15h8.2a2.4 2.4 0 0 1 1.6 4.2l-3 2.6"/></svg>' +
        kad + "</div></div>";
    }
    return "";
  }

  function soalan() {
    var q = D.KUIZ[idx];
    var el = document.getElementById("kuiz-kandungan");

    if (q.jenis === "dnd") {
      dndSoalan(q, el);
      return;
    }

    var pilihan = q.pilihan.map(function (p) {
      return '<button class="cip-kata" data-pilih="' + p + '">' + p + "</button>";
    }).join("");

    el.innerHTML = '<div class="kad kad-soalan">' +
      '<div class="kuiz-kepala">' + dots() + jenisBadge(q) + "</div>" +
      '<p class="soalan-teks">' + q.soalan.replace("______", '<span class="slot">______</span>') + "</p>" +
      media(q) +
      '<div class="pilihan">' + pilihan + "</div>" +
      '<div id="maklumKuiz" aria-live="polite"></div>' +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-dengar btn-sm" data-dengar="' + q.soalan + '" aria-label="Dengar soalan">' + Ikon.iko("pembesarSuara", 17) + " Dengar</button>" +
      '<button class="btn btn-utama" id="btnSeterusnya" disabled>Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</button></div></div>";

    wirePilihan(el, q);
    var btnAudio = el.querySelector("[data-main-audio]");
    if (btnAudio) {
      el.querySelectorAll("[data-main-audio]").forEach(function (b) {
        b.addEventListener("click", function () { AudioMesin.bangunkan(); AudioMesin[b.getAttribute("data-main-audio")](); });
      });
    }
  }

  function wirePilihan(el, q) {
    var sudah = false;
    el.querySelectorAll("[data-pilih]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (sudah) return;
        var p = b.getAttribute("data-pilih");
        var betul = p === q.jawab;
        sudah = true;
        if (betul) {
          b.classList.add("betul");
          AudioMesin.berjaya();
        } else {
          b.classList.add("salah");
          AudioMesin.gagal();
          el.querySelector('[data-pilih="' + q.jawab + '"]').classList.add("betul");
        }
        catat(q, betul);
        var m = document.getElementById("maklumKuiz");
        m.innerHTML = '<div class="maklum ' + (betul ? "maklum-betul" : "maklum-salah") + '">' +
          Ikon.iko(betul ? "semakBulat" : "lampu", 21) +
          '<div><strong>' + (betul ? "Hebat! Jawapan tepat." : "Hampir betul! Jawapan yang tepat ialah " + q.jawab + ".") + "</strong>" +
          q.penjelasan + "</div></div>";
        el.querySelector("#btnSeterusnya").disabled = false;
        el.querySelector("#btnSeterusnya").focus();
      });
    });
    el.querySelector("#btnSeterusnya").addEventListener("click", seterusnya);
  }

  /* Soalan drag & drop: satu kad kata, tiga kawasan kategori */
  function dndSoalan(q, el) {
    var zon = ["jarak", "perasaan", "pancaindera"].map(function (id) {
      return '<div class="zon" data-kat="' + id + '" style="min-height:120px">' +
        '<div class="zon-kepala">' + UI.chipKategori(id) + "</div>" +
        '<div class="zon-bekas"></div></div>';
    }).join("");

    el.innerHTML = '<div class="kad kad-soalan">' +
      '<div class="kuiz-kepala">' + dots() + jenisBadge(q) + "</div>" +
      '<p class="soalan-teks">' + q.soalan + "</p>" +
      '<div class="petunjuk-dnd" style="margin-bottom:16px">' + Ikon.iko("gerak", 18) + "<span>Seret kad ke kawasan atau ketik kad, kemudian ketik kawasan.</span></div>" +
      '<div style="display:flex;justify-content:center;margin-bottom:20px">' +
      '<button class="kad-kata" data-kata="' + q.perkataan + '" style="font-size:19px;padding:14px 30px;border-color:var(--biru)">' + q.perkataan.toUpperCase() + "</button></div>" +
      '<div class="dnd-grid" style="grid-template-columns:repeat(3,1fr)">' + zon + "</div>" +
      '<div id="maklumKuiz" aria-live="polite"></div>' +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-utama" id="btnSeterusnya" disabled>Seterusnya ' + Ikon.iko("anakPanahKanan", 17) + "</button></div></div>";

    var kad = el.querySelector("[data-kata]");
    var sudah = false;
    var terpilih = false;
    var mulaX = 0, mulaY = 0, menyeret = false, abaikanClick = false;

    kad.addEventListener("pointerdown", function (e) {
      mulaX = e.clientX; mulaY = e.clientY; menyeret = false; abaikanClick = false;
      terpilih = true;
      kad.classList.add("terpilih");
      try { kad.setPointerCapture(e.pointerId); } catch (ralat) { /* fallback klik */ }
    });
    kad.addEventListener("pointermove", function (e) {
      if (Math.abs(e.clientX - mulaX) > 10 || Math.abs(e.clientY - mulaY) > 10) menyeret = true;
      el.querySelectorAll(".zon").forEach(function (z) {
        var atas = document.elementFromPoint(e.clientX, e.clientY);
        z.classList.toggle("terarah", !!menyeret && !!atas && z.contains(atas));
      });
    });
    kad.addEventListener("pointerup", function (e) {
      el.querySelectorAll(".zon").forEach(function (z) { z.classList.remove("terarah"); });
      if (menyeret) {
        var atas = document.elementFromPoint(e.clientX, e.clientY);
        var zonDrop = atas && atas.closest ? atas.closest(".zon") : null;
        if (zonDrop && el.contains(zonDrop)) {
          abaikanClick = true;
          cuba(zonDrop);
        }
      }
    });
    kad.addEventListener("click", function () {
      if (abaikanClick) { abaikanClick = false; return; }
      if (sudah) return;
      terpilih = true;
      kad.classList.add("terpilih");
      AudioMesin.klik();
    });

    el.querySelectorAll(".zon").forEach(function (z) {
      z.addEventListener("click", function () { if (terpilih) cuba(z); });
      z.addEventListener("keydown", function (e) {
        if ((e.key === "Enter" || e.key === " ") && terpilih) { e.preventDefault(); cuba(z); }
      });
    });

    function cuba(z) {
      if (sudah) return;
      var betul = z.getAttribute("data-kat") === q.jawab;
      sudah = true;
      kad.classList.remove("terpilih");
      if (betul) {
        z.querySelector(".zon-bekas").innerHTML =
          '<div class="kad-serah betul">' + Ikon.iko("semak", 15) + q.perkataan + "</div>";
        AudioMesin.berjaya();
      } else {
        z.querySelector(".zon-bekas").innerHTML =
          '<div class="kad-serah salah">' + Ikon.iko("silang", 15) + q.perkataan + "</div>";
        AudioMesin.gagal();
        el.querySelector('[data-kat="' + q.jawab + '"] .zon-bekas').innerHTML =
          '<div class="kad-serah betul">' + Ikon.iko("semak", 15) + q.perkataan + "</div>";
      }
      catat(q, betul);
      var m = document.getElementById("maklumKuiz");
      m.innerHTML = '<div class="maklum ' + (betul ? "maklum-betul" : "maklum-salah") + '">' +
        Ikon.iko(betul ? "semakBulat" : "lampu", 21) +
        '<div><strong>' + (betul ? "Hebat! Jawapan tepat." : "Hampir betul!") + "</strong>" + q.penjelasan + "</div></div>";
      el.querySelector("#btnSeterusnya").disabled = false;
      el.querySelector("#btnSeterusnya").focus();
    }
    el.querySelector("#btnSeterusnya").addEventListener("click", seterusnya);
  }

  function catat(q, betul) {
    if (betul) skor.betul++;
    skor.kat[q.kategori].t++;
    if (betul) skor.kat[q.kategori].b++;
    Store.catatStat(q.kategori, betul);
  }

  function seterusnya() {
    idx++;
    if (idx < D.KUIZ.length) soalan();
    else hasil();
  }

  function hasil() {
    var el = document.getElementById("kuiz-kandungan");
    var pct = Math.round((skor.betul / D.KUIZ.length) * 100);
    var s = Store.dapat();
    var terbaik = Math.max(s.kuizTerbaik, pct);
    Store.set("kuizTerbaik", terbaik);
    Store.set("kuizTerakhir", {
      skor: pct, betul: skor.betul, jumlah: D.KUIZ.length,
      kat: {
        jarak: { b: skor.kat.jarak.b, t: skor.kat.jarak.t },
        perasaan: { b: skor.kat.perasaan.b, t: skor.kat.perasaan.t },
        pancaindera: { b: skor.kat.pancaindera.b, t: skor.kat.pancaindera.t }
      }
    });
    Store.misiSelesai("m5");
    var xpBaru = skor.betul * D.XP.soalanKuiz + D.XP.misi5;
    Store.tambahXp(skor.betul * D.XP.soalanKuiz);

    var lemah = "jarak";
    var lemahPct = 100;
    ["jarak", "perasaan", "pancaindera"].forEach(function (k) {
      var p = skor.kat[k].t ? Math.round((skor.kat[k].b / skor.kat[k].t) * 100) : 0;
      if (p < lemahPct) { lemahPct = p; lemah = k; }
    });

    var baris = ["jarak", "perasaan", "pancaindera"].map(function (k) {
      var p = skor.kat[k].t ? Math.round((skor.kat[k].b / skor.kat[k].t) * 100) : 0;
      return '<div class="hasil-kat-baris"><span class="nama">' + UI.ikonKategori(k, 17) + D.KATEGORI[k].label.toUpperCase() + "</span>" +
        '<div class="jalur kat-' + k + '" style="flex:1"><div class="jalur-dalam" style="width:' + p + '%"></div></div>' +
        '<span class="peratus">' + p + "%</span></div>";
    }).join("");

    var cadangan = lemahPct < 100
      ? "Cuba semula " + (lemah === "jarak" ? "Modul Jarak" : lemah === "perasaan" ? "Misi Perasaan" : "Modul Pancaindera") + " untuk mengukuhkan pemahaman."
      : "Kamu menguasai ketiga-tiga jenis kata adjektif dengan cemerlang!";

    el.innerHTML = '<div class="kad kuiz-hasil">' +
      '<div class="hasil-emoji-lingkar">' + Ikon.iko("trofi", 44) + "</div>" +
      '<h2>' + (pct >= 80 ? "Hebat!" : pct >= 50 ? "Bagus!" : "Teruskan Usaha!") + "</h2>" +
      '<p class="hasil-nombor">Skor: ' + pct + "% · " + skor.betul + "/" + D.KUIZ.length + " jawapan betul</p>" +
      '<div class="hasil-kat">' + baris + "</div>" +
      '<div class="cadangan">' + Ikon.iko("lampu", 20) + "<span>" + cadangan + "</span></div>" +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn btn-ghost" id="btnUlangKuiz">' + Ikon.iko("ulang", 17) + " Ulang Cabaran</button>" +
      '<a class="btn btn-utama" href="#/skor">' + Ikon.iko("carta", 17) + " Lihat Skor</a></div>" +
      "</div>";

    UI.konfeti(pct >= 80 ? 40 : 18);
    UI.kepalaXP();
    UI.toastXp(xpBaru);
    UI.toast("Misi 05 — Cabaran Akhir selesai!", "berjaya", "trofi");
    AudioMesin.lencana();

    if (Store.adaLencana("master")) {
      setTimeout(function () { UI.toast("Lencana Master Kata Adjektif dibuka!", "berjaya", "trofi"); }, 1500);
    }

    document.getElementById("btnUlangKuiz").addEventListener("click", function () {
      location.hash = "#/misi/5";
      location.reload();
    });
  }

  return { buka: buka };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — BOOT & PENDAWAIAN
   ============================================================ */
"use strict";

(function () {
  function butMula() {
    var s = Store.muat();
    AudioMesin.setHidup(s.sound);
    UI.gunaA11y();
    UI.bunyiUI();
    UI.kepalaXP();

    /* Splash */
    var splash = document.getElementById("splash");
    var mula = performance.now();
    function tutupSplash() {
      var tunggu = Math.max(0, 900 - (performance.now() - mula));
      setTimeout(function () {
        splash.classList.add("tutup");
        setTimeout(function () { splash.remove(); }, 600);
      }, tunggu);
    }
    window.addEventListener("load", tutupSplash);
    setTimeout(tutupSplash, 2000); // jaring keselamatan

    /* Bunyi */
    document.addEventListener("click", function () { AudioMesin.bangunkan(); }, { passive: true });

    /* Butang kepala */
    document.getElementById("btnBunyi").addEventListener("click", function () {
      UI.tukarA11y("bunyi");
      AudioMesin.klik();
    });
    document.getElementById("btnA11y").addEventListener("click", function () {
      UI.bukaPopA11y();
      AudioMesin.klik();
    });
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-a11y]");
      if (t) {
        var kunci = t.getAttribute("data-a11y");
        if (kunci === "reset") UI.tukarA11y("reset");
        else { UI.tukarA11y(kunci); AudioMesin.klik(); }
        return;
      }
      var saiz = e.target.closest("[data-a11y-saiz]");
      if (saiz) {
        UI.tukarA11y("saiz", parseInt(saiz.getAttribute("data-a11y-saiz"), 10));
        AudioMesin.klik();
        return;
      }
      if (!e.target.closest(".pop-a11y") && !e.target.closest("#btnA11y")) {
        UI.tutupPopA11y();
      }
    });

    /* Reset disahkan */
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-sah-reset]");
      if (t) {
        Store.setSemula();
        AudioMesin.setHidup(true);
        UI.gunaA11y(); UI.bunyiUI(); UI.kepalaXP();
        UI.tutupModal();
        UI.toast("Kemajuan telah ditetapkan semula", "info");
        setTimeout(function () { location.hash = "#/"; }, 250);
      }
      var tutup = e.target.closest("[data-tutup-modal]");
      if (tutup) { UI.tutupModal(); AudioMesin.klik(); }
    });

    /* Klik luar modal = tutup */
    var dlg = document.getElementById("modal");
    dlg.addEventListener("click", function (e) {
      if (e.target === dlg) UI.tutupModal();
    });
    dlg.addEventListener("close", function () { AudioMesin.hentiCakap(); });

    /* Bunyi klik pada butang */
    document.addEventListener("click", function (e) {
      if (e.target.closest(".btn")) AudioMesin.klik();
    }, { passive: true });

    /* TTS atas permintaan */
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-dengar]");
      if (t) {
        e.preventDefault();
        UI.dengar(t.getAttribute("data-dengar"));
      }
    });

    /* ESC */
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") UI.tutupPopA11y();
    });

    /* Router */
    window.addEventListener("hashchange", function () { UI.hala(); });
    UI.hala();

    /* Onboarding kali pertama */
    var st = Store.dapat();
    if (!st.onboarded) {
      setTimeout(function () { Screens.onboardingBuka(); }, 1200);
    }
  }

  /* Daftar laluan */
  UI.daftar(/^\/?$/, function () { return Screens.home(); });
  UI.daftar(/^\/belajar$/, function () { return Screens.belajar(); });
  UI.daftar(/^\/modul\/(jarak|perasaan|pancaindera)$/, function (m) { return Screens.modul(m[1]); });
  UI.daftar(/^\/misi$/, function () { return Screens.misi(); });
  UI.daftar(/^\/misi\/2$/, function () { return Screens.sentuhPilih(); });
  UI.daftar(/^\/misi\/3$/, function () { return Screens.ar(); });
  UI.daftar(/^\/ar$/, function () { return Screens.ar(); });
  UI.daftar(/^\/misi\/4$/, function () { return Screens.binaAyat(); });
  UI.daftar(/^\/misi\/5$/, function () { return Screens.cabaran(); });
  UI.daftar(/^\/skor$/, function () { return Screens.skor(); });
  UI.daftar(/^\/lencana$/, function () { return Screens.lencana(); });
  UI.daftar(/^\/guru$/, function () { return Screens.guru(); });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", butMula);
  } else {
    butMula();
  }
})();

</script>
</body>
</html>
