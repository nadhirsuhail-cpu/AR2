<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KATA+ AR — Misi Kata Adjektif | Bahasa Melayu Tahun 3</title>
<meta name="description" content="Aplikasi pembelajaran interaktif kata adjektif untuk murid Tahun 3 — KSSR Bahasa Melayu, Standard Kandungan 5.1, Standard Pembelajaran 5.1.3. Kenali, gerakkan, pilih dan kuasai kata adjektif jarak, perasaan dan pancaindera.">
<meta name="theme-color" content="#f6f7f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KATA+ AR — MISI KATA ADJEKTIF
   Sistem reka bentuk: minimal premium, berinspirasikan
   kesederhanaan editorial — bukan tiruan mana-mana jenama.
   ============================================================ */
@import url('https://fonts.cdnfonts.com/css/opendyslexic');

/* ---------- 1. TOKEN ---------- */
:root {
  --bg: #f6f7f4;
  --permukaan: #ffffff;
  --permukaan2: #f0f1ec;
  --dakwat: #17181c;
  --dakwat2: #555a63;
  --dakwat3: #8a8f98;
  --garis: rgba(23, 24, 28, 0.1);
  --garis-kuat: rgba(23, 24, 28, 0.18);

  --biru: #2e63f0;
  --biru-tua: #1d48bd;
  --biru2: #dce6ff;

  --jarak: #0e9d8c;
  --jarak2: #ddf2ee;
  --perasaan: #d9507b;
  --perasaan2: #fce8ee;
  --pancaindera: #6f52e0;
  --pancaindera2: #ede9fc;

  --hijau: #12865f;
  --hijau2: #ddf3e9;
  --ambar: #b8791a;
  --ambar2: #fbf0dc;
  --merah: #cf4a58;
  --merah2: #fbeaec;

  --r-s: 12px;
  --r-m: 18px;
  --r-l: 26px;
  --r-xl: 34px;

  --bayang-s: 0 1px 2px rgba(23, 24, 28, 0.04), 0 2px 10px rgba(23, 24, 28, 0.04);
  --bayang-m: 0 2px 6px rgba(23, 24, 28, 0.05), 0 14px 34px rgba(23, 24, 28, 0.08);
  --bayang-l: 0 6px 16px rgba(23, 24, 28, 0.07), 0 28px 70px rgba(23, 24, 28, 0.12);

  --lega: cubic-bezier(0.22, 1, 0.36, 1);
  --pantas: 0.25s;
  --sederhana: 0.45s;

  --lebar-bekas: 1120px;
  --a11y-zoom: 1;
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- 2. ASAS ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--dakwat);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
  zoom: var(--a11y-zoom, 1);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
button { font-family: inherit; }
a { color: var(--biru); }
::selection { background: var(--biru2); }

:focus-visible {
  outline: 3px solid var(--biru);
  outline-offset: 2px;
  border-radius: 6px;
}

.langkau {
  position: fixed; top: -60px; left: 16px; z-index: 200;
  background: var(--dakwat); color: #fff;
  padding: 10px 18px; border-radius: 999px; text-decoration: none;
  transition: top 0.2s var(--lega);
}
.langkau:focus { top: 12px; }

/* ---------- 3. MOD KEBOLECAPAIAN ---------- */
html.font-lg { font-size: 19px; --a11y-zoom: 1.08; }
html.font-xl { font-size: 21px; --a11y-zoom: 1.16; }
html.dyslexic body { font-family: "OpenDyslexic", "Comic Sans MS", var(--font); }
html.dyslexic { line-height: 1.75; }

html.kontras {
  --bg: #ffffff;
  --permukaan: #ffffff;
  --permukaan2: #eef0eb;
  --dakwat: #000000;
  --dakwat2: #2e3138;
  --dakwat3: #3f434b;
  --garis: rgba(0, 0, 0, 0.28);
  --garis-kuat: rgba(0, 0, 0, 0.5);
  --jarak: #006b5f;
  --perasaan: #b3123f;
  --pancaindera: #4527c0;
  --biru: #1744c7;
}

html.no-anim *, html.no-anim *::before, html.no-anim *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}

.iko {
  width: 22px; height: 22px;
  fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  flex: none;
}

/* ---------- 4. SPLASH ---------- */
#splash {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.5s var(--lega), visibility 0.5s;
}
#splash.tutup { opacity: 0; visibility: hidden; pointer-events: none; }
.splash-dalam { text-align: center; animation: splash-masuk 0.7s var(--lega) both; }
.splash-tanda {
  font-size: clamp(40px, 8vw, 64px); font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.1;
}
.splash-tanda span { color: var(--biru); }
.splash-sub { color: var(--dakwat2); font-weight: 600; margin-top: 6px; font-size: 17px; }
.splash-bar {
  width: 140px; height: 4px; border-radius: 99px;
  background: var(--permukaan2); margin: 28px auto 0; overflow: hidden;
}
.splash-bar span {
  display: block; height: 100%; width: 40%;
  background: var(--biru); border-radius: 99px;
  animation: splash-bar 1.1s var(--lega) infinite;
}
@keyframes splash-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
@keyframes splash-masuk { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }

/* ---------- 5. KEPALA ---------- */
#kepala {
  position: sticky; top: 0; z-index: 90;
  background: rgba(255, 255, 255, 0.82);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  backdrop-filter: saturate(1.6) blur(18px);
  border-bottom: 1px solid var(--garis);
}
.kepala-dalam {
  max-width: var(--lebar-bekas); margin: 0 auto;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 28px;
}
.logo { display: flex; flex-direction: column; text-decoration: none; color: inherit; line-height: 1.15; }
.logo-tanda { font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
.logo-tanda em { color: var(--biru); font-style: normal; }
.logo-sub { font-size: 11.5px; color: var(--dakwat3); font-weight: 600; letter-spacing: 0.02em; }
.nav-atas { display: flex; gap: 4px; margin: 0 auto; }
.nav-link {
  text-decoration: none; color: var(--dakwat2);
  font-weight: 600; font-size: 15.5px;
  padding: 9px 15px; border-radius: 999px;
  transition: background 0.2s, color 0.2s;
}
.nav-link:hover { background: var(--permukaan2); color: var(--dakwat); }
.nav-link.aktif { background: var(--dakwat); color: #fff; }
.kepala-aksi { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.cip-xp {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--biru2); color: var(--biru-tua);
  font-weight: 800; font-size: 14.5px;
  padding: 7px 14px; border-radius: 999px;
  white-space: nowrap;
}
.cip-xp .iko { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.btn-iko {
  width: 42px; height: 42px; border-radius: 999px;
  border: 1px solid var(--garis); background: var(--permukaan);
  color: var(--dakwat2); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.18s var(--lega), background 0.2s, color 0.2s;
}
.btn-iko:hover { background: var(--permukaan2); color: var(--dakwat); }
.btn-iko:active { transform: scale(0.92); }
.btn-iko.aktif { color: var(--biru); border-color: var(--biru2); background: var(--biru2); }

/* ---------- 6. BEKAS & SKRIN ---------- */
#utama { min-height: calc(100vh - 66px); }
#view { animation: skrin-masuk 0.45s var(--lega); }
@keyframes skrin-masuk { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.bekas {
  max-width: var(--lebar-bekas);
  margin: 0 auto;
  padding: 48px 24px 120px;
}
.bekas-sempit { max-width: 780px; }

.kepala-skrin {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 34px;
}
.kepala-skrin-teks { flex: 1; min-width: 0; }
.kepala-skrin h1 {
  margin: 0; font-size: clamp(28px, 4vw, 38px);
  font-weight: 800; letter-spacing: -0.025em; line-height: 1.15;
}
.kepala-skrin .sub { margin: 8px 0 0; color: var(--dakwat2); font-size: 16.5px; max-width: 60ch; }
.btn-belakang {
  flex: none; width: 46px; height: 46px; border-radius: 999px;
  border: 1px solid var(--garis); background: var(--permukaan);
  color: var(--dakwat); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.18s var(--lega), background 0.2s;
  margin-top: 2px;
}
.btn-belakang:hover { background: var(--permukaan2); }
.btn-belakang:active { transform: scale(0.92); }

/* ---------- 7. BUTANG ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border-radius: 999px; cursor: pointer; text-decoration: none;
  font-weight: 700; font-size: 16px; line-height: 1.2;
  padding: 14px 26px; min-height: 48px;
  border: 1px solid transparent;
  transition: transform 0.18s var(--lega), box-shadow 0.25s, background 0.25s, color 0.25s, border-color 0.25s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-utama { background: var(--biru); color: #fff; box-shadow: 0 2px 8px rgba(46, 99, 240, 0.28); }
.btn-utama:hover { background: var(--biru-tua); box-shadow: 0 4px 14px rgba(46, 99, 240, 0.34); }
.btn-ghost { background: var(--permukaan); color: var(--dakwat); border-color: var(--garis-kuat); }
.btn-ghost:hover { background: var(--permukaan2); }
.btn-ink { background: var(--dakwat); color: #fff; }
.btn-ink:hover { background: #000; }
.btn-lg { font-size: 17.5px; padding: 17px 34px; min-height: 58px; }
.btn-sm { font-size: 14.5px; padding: 9px 18px; min-height: 40px; }
.btn-kecil { font-size: 13.5px; padding: 7px 14px; min-height: 36px; font-weight: 700; }

/* ---------- 8. CIP & KAD ---------- */
.cip {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: 999px; padding: 6px 14px;
  font-size: 13.5px; font-weight: 700;
  border: 1px solid var(--garis); background: var(--permukaan);
  color: var(--dakwat2); white-space: nowrap;
}
.cip .iko { width: 15px; height: 15px; }

.cip-kat {
  --kat: var(--biru); --kat2: var(--biru2);
  color: var(--kat); background: var(--kat2); border-color: transparent;
}
.cip-kat.jarak { --kat: var(--jarak); --kat2: var(--jarak2); }
.cip-kat.perasaan { --kat: var(--perasaan); --kat2: var(--perasaan2); }
.cip-kat.pancaindera { --kat: var(--pancaindera); --kat2: var(--pancaindera2); }

.cip-kata {
  font-size: 17px; font-weight: 800; color: var(--dakwat);
  padding: 10px 20px; min-height: 46px; border-radius: 999px;
  background: var(--permukaan); border: 1.5px solid var(--garis);
  cursor: pointer; transition: transform 0.18s var(--lega), border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
  user-select: none;
}
.cip-kata:hover { border-color: var(--garis-kuat); transform: translateY(-1px); }
.cip-kata:active { transform: scale(0.96); }
.cip-kata.terpilih { border-color: var(--biru); background: var(--biru2); color: var(--biru-tua); }

.kad {
  background: var(--permukaan);
  border: 1px solid var(--garis);
  border-radius: var(--r-l);
  box-shadow: var(--bayang-s);
}
.kad-klik {
  cursor: pointer;
  transition: transform 0.25s var(--lega), box-shadow 0.25s, border-color 0.25s;
}
.kad-klik:hover { transform: translateY(-3px); box-shadow: var(--bayang-m); border-color: var(--garis-kuat); }
.kad-klik:active { transform: scale(0.985); }

.grid { display: grid; gap: 20px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

.jalur {
  height: 9px; border-radius: 99px; background: var(--permukaan2);
  overflow: hidden; position: relative;
}
.jalur-dalam {
  height: 100%; border-radius: 99px;
  background: var(--biru);
  transition: width 0.6s var(--lega);
}

/* ---------- 9. HERO ---------- */
.hero {
  position: relative;
  padding: clamp(56px, 9vw, 110px) 24px 40px;
  text-align: center;
  overflow: hidden;
}
.hero-latar {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(560px 300px at 50% -60px, rgba(46, 99, 240, 0.09), transparent 70%),
    radial-gradient(420px 260px at 12% 70%, rgba(14, 157, 140, 0.07), transparent 70%),
    radial-gradient(420px 260px at 88% 72%, rgba(111, 82, 224, 0.07), transparent 70%);
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--permukaan); border: 1px solid var(--garis);
  border-radius: 999px; padding: 8px 18px;
  font-size: 13.5px; font-weight: 700; color: var(--dakwat2);
  box-shadow: var(--bayang-s);
  animation: hero-masuk 0.7s var(--lega) both;
}
.hero-h1 {
  margin: 26px 0 0;
  font-size: clamp(52px, 10vw, 96px);
  font-weight: 800; letter-spacing: -0.04em; line-height: 1.02;
  animation: hero-masuk 0.7s 0.08s var(--lega) both;
}
.hero-h1 em { color: var(--biru); font-style: normal; }
.hero-nama {
  margin: 10px 0 0;
  font-size: clamp(24px, 4vw, 34px); font-weight: 700;
  letter-spacing: -0.02em; color: var(--dakwat);
  animation: hero-masuk 0.7s 0.16s var(--lega) both;
}
.hero-tagline {
  margin: 18px 0 0;
  font-size: clamp(17px, 2.4vw, 21px); color: var(--dakwat2);
  animation: hero-masuk 0.7s 0.24s var(--lega) both;
}
.hero-cta {
  margin-top: 34px;
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
  animation: hero-masuk 0.7s 0.32s var(--lega) both;
}
@keyframes hero-masuk { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

/* Kad 3D terapung */
.hero-pentas {
  position: relative; height: 260px;
  margin-top: 48px;
  display: flex; align-items: center; justify-content: center;
}
.kad-3d {
  position: absolute;
  width: 218px;
  background: var(--permukaan);
  border: 1px solid var(--garis);
  border-radius: var(--r-l);
  box-shadow: var(--bayang-m);
  padding: 20px 22px;
  text-align: left;
  will-change: transform;
}
.kad-3d .kad-3d-kepala { display: flex; align-items: center; gap: 10px; }
.kad-3d .gelembung {
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.kad-3d .gelembung .iko { width: 20px; height: 20px; }
.kad-3d h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.01em; }
.kad-3d p { margin: 4px 0 14px; font-size: 13px; color: var(--dakwat3); line-height: 1.45; }
.kad-3d .kad-3d-kata { display: flex; flex-wrap: wrap; gap: 6px; }
.kad-3d .kata-kecil {
  font-size: 12.5px; font-weight: 700; border-radius: 99px;
  padding: 4px 11px; border: 1px solid var(--garis); color: var(--dakwat2);
}
.kad-3d.j { left: max(8%, 30px); transform: rotate(-7deg) translateY(10px); }
.kad-3d.p { left: 50%; transform: translateX(-50%) translateY(34px) scale(1.05); z-index: 2; }
.kad-3d.pc { right: max(8%, 30px); transform: rotate(7deg) translateY(6px); }
.kad-3d.j .gelembung { background: var(--jarak); }
.kad-3d.p .gelembung { background: var(--perasaan); }
.kad-3d.pc .gelembung { background: var(--pancaindera); }
.kad-3d.terapung { animation: terapung 7s ease-in-out infinite alternate; }
.kad-3d.j.terapung { animation-delay: 0s; }
.kad-3d.p.terapung { animation-delay: 1.2s; }
.kad-3d.pc.terapung { animation-delay: 2.4s; }
@keyframes terapung {
  from { margin-top: 0; }
  to { margin-top: -14px; }
}
.kad-3d.duduk { position: relative; inset: auto; left: auto; right: auto; transform: none; margin: 0; }
@media (max-width: 720px) {
  .hero-pentas { height: auto; flex-direction: column; gap: 16px; }
  .kad-3d.j, .kad-3d.p, .kad-3d.pc {
    position: relative; inset: auto; left: auto; right: auto;
    transform: none !important; margin-top: 0 !important;
    width: 100%; max-width: 300px; animation: none !important;
  }
}

/* Pilihan wajah (Modul Perasaan) */
.pilihan-face {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--permukaan); border: 1.5px solid var(--garis);
  border-radius: var(--r-m); padding: 14px 16px 12px;
  cursor: pointer; min-height: 150px; min-width: 118px;
  font-weight: 800; font-size: 15.5px; color: var(--dakwat);
  transition: transform 0.18s var(--lega), border-color 0.2s, background 0.2s, box-shadow 0.2s;
  user-select: none;
}
.pilihan-face svg { width: 82px; height: 82px; }
.pilihan-face:hover { transform: translateY(-2px); border-color: var(--garis-kuat); box-shadow: var(--bayang-s); }
.pilihan-face:active { transform: scale(0.96); }
.pilihan-face:disabled { opacity: 0.5; cursor: not-allowed; }
.pilihan-face.betul {
  border-color: var(--hijau); background: var(--hijau2); color: var(--hijau);
  animation: nadi-betul 0.5s var(--lega);
}
.pilihan-face.salah {
  border-color: var(--merah); background: var(--merah2); color: var(--merah);
  animation: goncang 0.45s;
}
.pilihan-face-grup { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; }

/* ---------- 10. SEKSYEN ---------- */
.seksyen { padding: clamp(48px, 7vw, 88px) 24px; }
.seksyen-kepala { text-align: center; margin-bottom: 44px; }
.seksyen-kepala h2 {
  margin: 0; font-size: clamp(26px, 3.6vw, 38px);
  font-weight: 800; letter-spacing: -0.025em;
}
.seksyen-kepala p { margin: 10px auto 0; color: var(--dakwat2); max-width: 56ch; }
.buka {
  opacity: 0; transform: translateY(26px);
  transition: opacity 0.7s var(--lega), transform 0.7s var(--lega);
}
.buka.nampak { opacity: 1; transform: none; }

/* Kad kategori */
.kad-kat {
  --kat: var(--biru); --kat2: var(--biru2);
  padding: 28px; display: flex; flex-direction: column; gap: 6px;
  position: relative; overflow: hidden;
}
.kad-kat::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: var(--kat); opacity: 0.9;
}
.kad-kat .kad-kat-iko {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--kat2); color: var(--kat);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
}
.kad-kat .kad-kat-iko .iko { width: 26px; height: 26px; }
.kad-kat h3 { margin: 0; font-size: 21px; font-weight: 800; }
.kad-kat p { margin: 0; color: var(--dakwat2); font-size: 15px; line-height: 1.55; }
.kad-kat .kad-kat-kata { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.kad-kat .kata-kecil { font-size: 13px; font-weight: 700; border-radius: 99px; padding: 5px 12px; background: var(--kat2); color: var(--kat); }
.kad-kat .kad-kat-status { margin-top: auto; padding-top: 16px; font-size: 13.5px; font-weight: 700; color: var(--dakwat3); display: flex; align-items: center; gap: 7px; }
.kad-kat.jarak { --kat: var(--jarak); --kat2: var(--jarak2); }
.kad-kat.perasaan { --kat: var(--perasaan); --kat2: var(--perasaan2); }
.kad-kat.pancaindera { --kat: var(--pancaindera); --kat2: var(--pancaindera2); }

/* Laluan misi (home) */
.laluan-misi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.langkah {
  background: var(--permukaan); border: 1px solid var(--garis);
  border-radius: var(--r-m); padding: 18px 14px;
  text-decoration: none; color: inherit;
  transition: transform 0.25s var(--lega), box-shadow 0.25s, border-color 0.25s;
}
.langkah:hover { transform: translateY(-3px); box-shadow: var(--bayang-m); }
.langkah-nombor {

  background: var(--permukaan2); color: var(--dakwat2);

/* ---------- 11. SOALAN (pola biasa modul & aktiviti) ---------- */
.kad-soalan { padding: clamp(24px, 4vw, 44px); }
.soalan-kepala { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }

.pilihan .cip-kata.betul {

}

}

@keyframes nadi-betul { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
@keyframes goncang {
  0%, 100% { transform: translateX(0); }

  60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}
.maklum {

}

.kawal-soalan { margin-top: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.btn-dengar { background: var(--permukaan2); border: none; }

/* ---------- 12. MODUL: VISUALIZER JARAK ---------- */

}

}

}

/* ---------- 13. MODUL: WAJAH ---------- */

}

.kad-cerita {

/* ---------- 14. MODUL: GALERI DERIA ---------- */

.kad-deria {

/* ---------- 16. DRAG & DROP ---------- */
.dnd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
.zon {

.kad-kata {

/* ---------- 17. AR ---------- */
.ar-bekas { padding-top: 28px; }
.ar-privasi {

  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.ar-privasi .privasi-iko {

  background: var(--biru2); color: var(--biru);
  display: flex; align-items: center; justify-content: center;
}

}

}
.ar-arahan { flex: 1; min-width: 200px; }
.ar-arahan strong { display: block; font-size: 17px; font-weight: 800; }
.ar-arahan span { font-size: 13.5px; color: var(--dakwat2); }
.ar-ruang { position: relative; flex: 1; min-height: 380px; overflow: hidden; }
.ar-kad {
  position: absolute; z-index: 3;
  padding: 12px 20px; border-radius: 16px;

  border: 2px solid var(--garis);

/* ---------- 18. KUIZ ---------- */

.isyarat-soalan { display: flex; align-items: center; gap: 28px; justify-content: center; flex-wrap: wrap; }

<script>
/* ============================================================
   KATA+ AR — ENJIN AUDIO
   Semua bunyi disintesis dengan Web Audio API (tiada fail,
   muat pantas). Bunyi lembut — tiada kesan yang kasar.
   Audio boleh dimatikan sepenuhnya (tetapan pengguna).
   ============================================================ */
"use strict";

window.AudioMesin = (function () {
  var ctx = null;
  var hidup = true;

  function pastikanCtx() {
    if (!ctx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      } catch (e) {
        ctx = null;
      }
    }
    if (ctx && ctx.state === "suspended") {
      try { ctx.resume(); } catch (e) { /* abaikan */ }
    }
    return ctx;
  }

  function setHidup(h) { hidup = !!h; }
  function getHidup() { return hidup; }

  /** Bangunkan konteks pada gerak isyarat pertama pengguna. */
  function bangunkan() { pastikanCtx(); }

  function nada(frek, mula, tempoh, jenis, puncak) {
    var c = ctx;
    if (!c || !hidup) return;
    try {
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = jenis || "sine";
      o.frequency.setValueAtTime(frek, c.currentTime + mula);
      g.gain.setValueAtTime(0.0001, c.currentTime + mula);
      g.gain.exponentialRampToValueAtTime(puncak || 0.16, c.currentTime + mula + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + mula + tempoh);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + mula);
      o.stop(c.currentTime + mula + tempoh + 0.05);
    } catch (e) { /* abaikan */ }
  }

  function glissando(f1, f2, mula, tempoh, jenis, puncak) {
    var c = ctx;
    if (!c || !hidup) return;
    try {
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = jenis || "sine";
      o.frequency.setValueAtTime(f1, c.currentTime + mula);
      o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + mula + tempoh);
      g.gain.setValueAtTime(0.0001, c.currentTime + mula);
      g.gain.exponentialRampToValueAtTime(puncak || 0.14, c.currentTime + mula + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + mula + tempoh);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + mula);
      o.stop(c.currentTime + mula + tempoh + 0.05);
    } catch (e) { /* abaikan */ }
  }

  function desah(mula, tempoh, potongan, puncak) {
    var c = ctx;
    if (!c || !hidup) return;
    try {
      var len = Math.max(1, Math.floor(c.sampleRate * tempoh));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = c.createBufferSource();
      src.buffer = buf;
      var tapis = c.createBiquadFilter();
      tapis.type = "lowpass";
      tapis.frequency.setValueAtTime(potongan || 1000, c.currentTime + mula);
      tapis.frequency.exponentialRampToValueAtTime(180, c.currentTime + mula + tempoh);
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime + mula);
      g.gain.exponentialRampToValueAtTime(puncak || 0.12, c.currentTime + mula + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + mula + tempoh);
      src.connect(tapis); tapis.connect(g); g.connect(c.destination);
      src.start(c.currentTime + mula);
    } catch (e) { /* abaikan */ }
  }

  /* ---------- BUNYI-BUNYI APLIKASI ---------- */

  /** Kejayaan: lonceng dua nada lembut */
  function berjaya() {
    if (!pastikanCtx()) return;
    nada(659.25, 0, 0.22, "sine", 0.14);
    nada(880, 0.09, 0.3, "sine", 0.13);
  }

  /** Jawapan salah: nada rendah lembut, BUKAN bunyi kasar */
  function gagal() {
    if (!pastikanCtx()) return;
    glissando(392, 311, 0, 0.26, "sine", 0.09);
  }

  /** Petunjuk: nada tunggal ringan */
  function petunjuk() {
    if (!pastikanCtx()) return;
    nada(587.33, 0, 0.24, "triangle", 0.11);
  }

  /** Klik butang: sangat ringan */
  function klik() {
    if (!pastikanCtx()) return;
    nada(1100, 0, 0.045, "sine", 0.05);
  }

  /** Lencana dibuka: arpeggio pendek */
  function lencana() {
    if (!pastikanCtx()) return;
    var n = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < n.length; i++) nada(n[i], i * 0.1, 0.28, "triangle", 0.13);
  }

  /** Bunyi merdu: melodi pentatonik pendek (untuk soalan audio) */
  function merdu() {
    if (!pastikanCtx()) return;
    var m = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    for (var i = 0; i < m.length; i++) nada(m[i], i * 0.14, 0.26, "triangle", 0.12);
  }

  /** Bunyi bising: desah rendah (untuk soalan audio) */
  function bising() {
    if (!pastikanCtx()) return;
    desah(0, 0.85, 900, 0.16);
    desah(0.1, 0.7, 500, 0.1);
  }

  /** Bunyi tangkap kad AR */
  function tangkap() {
    if (!pastikanCtx()) return;
    glissando(520, 920, 0, 0.18, "sine", 0.12);
    nada(1318.5, 0.12, 0.2, "sine", 0.08);
  }

  /** Sapuan untuk swipe */
  function sapu() {
    if (!pastikanCtx()) return;
    desah(0, 0.24, 1800, 0.08);
  }

  /* ---------- SUARA (TTS Bahasa Melayu) ---------- */
  function cakap(teks) {
    if (!hidup) return;
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(teks);
      u.lang = "ms-MY";
      u.rate = 0.95;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) { /* abaikan */ }
  }

  function hentiCakap() {
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) { /* abaikan */ }
  }

  return {
    setHidup: setHidup, getHidup: getHidup,
    bangunkan: bangunkan,
    berjaya: berjaya, gagal: gagal, petunjuk: petunjuk,
    klik: klik, lencana: lencana,
    merdu: merdu, bising: bising,
    tangkap: tangkap, sapu: sapu,
    cakap: cakap, hentiCakap: hentiCakap
  };
})();

<script>
/* ============================================================
   KATA+ AR — SIMPANAN KEMAJUAN (localStorage)
   Kemajuan murid kekal walaupun halaman dimuat semula.
   Semua capaian storan dibungkus dengan try/catch kerana
   sesetengah pelayar menyekat localStorage pada file://.
   ============================================================ */
"use strict";

window.Store = (function () {
  var KUNCI = "kataar-v1";

  var asal = {
    v: 1,
    onboarded: false,
    sound: true,
    a11y: { saiz: 0, disleksia: false, kontras: false, noanim: false },
    xp: 0,
    modul: { jarak: false, perasaan: false, pancaindera: false },
    misi: { m1: false, m2: false, m3: false, m4: false, m5: false },
    lencana: [],
    stat: {
      jarak: { betul: 0, jumlah: 0 },
      perasaan: { betul: 0, jumlah: 0 },
      pancaindera: { betul: 0, jumlah: 0 }
    },
    kuizTerbaik: 0,
    kuizTerakhir: null,
    arPernah: false,
    arKamera: false,
    instrumen: { item: {}, komen: ["", ""] }
  };

  var st = null;

  function salin(o) { return JSON.parse(JSON.stringify(o)); }

  function muat() {
    try {
      var mentah = localStorage.getItem(KUNCI);
      var s = mentah ? JSON.parse(mentah) : null;
      st = Object.assign({}, salin(asal), s || {});
      st.a11y = Object.assign({}, salin(asal.a11y), (s && s.a11y) || {});
      st.modul = Object.assign({}, salin(asal.modul), (s && s.modul) || {});
      st.misi = Object.assign({}, salin(asal.misi), (s && s.misi) || {});
      st.stat = Object.assign({}, salin(asal.stat), (s && s.stat) || {});
      st.instrumen = Object.assign({}, salin(asal.instrumen), (s && s.instrumen) || {});
    } catch (e) {
      st = salin(asal);
    }
    return st;
  }

  function simpan() {
    try { localStorage.setItem(KUNCI, JSON.stringify(st)); } catch (e) { /* storan disekat */ }
  }

  function dapat() { return st || muat(); }

  function set(kunci, nilai) {
    var s = dapat();
    s[kunci] = nilai;
    simpan();
  }

  /* ---------- XP & TAHAP ---------- */
  function tambahXp(n) {
    var s = dapat();
    s.xp += n;
    simpan();
    return s.xp;
  }

  function tahap() {
    var s = dapat();
    var nama = "Penjelajah Kata";
    for (var i = 0; i < DataApp.TAHAP.length; i++) {
      if (s.xp >= DataApp.TAHAP[i].min) nama = DataApp.TAHAP[i].nama;
    }
    return nama;
  }

  /* ---------- STATISTIK PER KATEGORI ---------- */
  function catatStat(kategori, betul) {
    var s = dapat();
    if (!s.stat[kategori]) return;
    s.stat[kategori].jumlah += 1;
    if (betul) s.stat[kategori].betul += 1;
    simpan();
  }

  function peratusKat(kategori) {
    var s = dapat();
    var stt = s.stat[kategori];
    if (!stt || stt.jumlah === 0) return null;
    return Math.round((stt.betul / stt.jumlah) * 100);
  }

  /* ---------- MISI & MODUL ---------- */
  function modulSelesai(id) {
    var s = dapat();
    if (s.modul[id]) return;
    s.modul[id] = true;
    simpan();
    // lencana modul
    var petanya = {
      jarak: "pemerhati-jarak",
      perasaan: "pembaca-perasaan",
      pancaindera: "pakar-pancaindera"
    };
    bukaLencana(petanya[id]);
    // misi 1 selesai apabila ketiga-tiga modul selesai
    if (s.modul.jarak && s.modul.perasaan && s.modul.pancaindera && !s.misi.m1) {
      s.misi.m1 = true;
      s.xp += DataApp.XP.modul;
      simpan();
      semakMaster();
    }
    simpan();
  }

  function misiSelesai(id) {
    var s = dapat();
    if (s.misi[id]) return;
    s.misi[id] = true;
    var xpMap = { m2: DataApp.XP.misi2, m3: DataApp.XP.misi3, m4: DataApp.XP.misi4, m5: DataApp.XP.misi5 };
    tambahXp(xpMap[id] || 0);
    simpan();
    semakMaster();
  }

  function semakMaster() {
    var s = dapat();
    if (s.misi.m1 && s.misi.m2 && s.misi.m3 && s.misi.m4 && s.misi.m5) {
      bukaLencana("master");
    }
  }

  function bukaLencana(id) {
    var s = dapat();
    if (s.lencana.indexOf(id) === -1) {
      s.lencana.push(id);
      simpan();
      return true; // baru dibuka
    }
    return false;
  }

  function misiSelesaiCount() {
    var s = dapat();
    var n = 0;
    for (var k in s.misi) if (s.misi[k]) n++;
    return n;
  }

  /* ---------- LENCANA TERBUKA / TERKUNCI ---------- */
  function adaLencana(id) {
    return dapat().lencana.indexOf(id) !== -1;
  }

  function setSemula() {
    try { localStorage.removeItem(KUNCI); } catch (e) { /* abaikan */ }
    st = salin(asal);
  }

  return {
    muat: muat, simpan: simpan, dapat: dapat, set: set,
    tambahXp: tambahXp, tahap: tahap,
    catatStat: catatStat, peratusKat: peratusKat,
    modulSelesai: modulSelesai, misiSelesai: misiSelesai,
    misiSelesaiCount: misiSelesaiCount,
    bukaLencana: bukaLencana, adaLencana: adaLencana,
    setSemula: setSemula
  };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — KERANGKA UI
   Router hash, toast, modal, konfeti, bar kebolehcapaian,
   kesan reveal & paralaks. Semua elemen dibina dengan JS.
   ============================================================ */
"use strict";

window.UI = (function () {
  var routes = [];
  var pemerhati = null;
  var kurangkanGerak = function () {
    try {
      return window.matchMedia && (window.matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.contains("no-anim"));
    } catch (e) { return false; }
  };

  /* ---------- RENDER ---------- */
  function render(html) {
    document.getElementById("view").innerHTML = html;
    lekatPemerhati();
    AudioMesin.hentiCakap();
  }

  function $(sel, akar) {
    return (akar || document).querySelector(sel);
  }
  function semua(sel, akar) {
    return Array.prototype.slice.call((akar || document).querySelectorAll(sel));
  }

  /* ---------- ROUTER ---------- */
  function daftar(pat, renderFn) {
    routes.push({ pat: pat, render: renderFn });
  }

  function hala() {
    var h = (location.hash || "#/").replace(/^#/, "") || "/";
    if (h.length > 1 && h.charAt(h.length - 1) === "/") h = h.slice(0, -1);
    var ditemui = false;
    for (var i = 0; i < routes.length; i++) {
      var m = h.match(routes[i].pat);
      if (m) {
        var hasil = routes[i].render(m);
        render(hasil.html);
        if (hasil.init) hasil.init(m);
        ditemui = true;
        break;
      }
    }
    if (!ditemui) location.hash = "#/";
    aktifNav(h);
    window.scrollTo({ top: 0, behavior: kurangkanGerak() ? "auto" : "smooth" });
    var judul = $("#view h1, #view .kepala-skrin h1");
    if (judul) { judul.setAttribute("tabindex", "-1"); judul.focus({ preventScroll: true }); }
    else { var utama = document.getElementById("utama"); utama.focus({ preventScroll: true }); }
  }

  function aktifNav(h) {
    var peta = {
      "home": /^\/?$/, "belajar": /^\/(belajar|modul)/, "misi": /^\/misi/,
      "ar": /^\/ar$|^\/misi\/3/, "skor": /^\/(skor|lencana|guru)/
    };
    semua("[data-nav]").forEach(function (a) {
      var kunci = a.getAttribute("data-nav");
      a.classList.toggle("aktif", peta[kunci] && peta[kunci].test(h));
    });
  }

  /* ---------- TOAST ---------- */
  function toast(teks, jenis, ikon) {
    var zon = document.getElementById("toast-zone");
    var t = document.createElement("div");
    t.className = "toast toast-" + (jenis || "info");
    t.setAttribute("role", "status");
    t.innerHTML = (ikon ? Ikon.iko(ikon, 18) : "") + "<span>" + teks + "</span>";
    zon.appendChild(t);
    var s = kurangkanGerak() ? 1 : 4;
    setTimeout(function () {
      t.classList.add("tutup");
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
    }, s * 1000);
  }

  function toastXp(n) {
    toast("+" + n + " XP", "xp", "kilat");
  }

  /* ---------- MODAL ---------- */
  function modal(html) {
    var d = document.getElementById("modal");
    var isi = document.getElementById("modalIsi");
    isi.innerHTML = html;
    if (typeof d.showModal === "function") {
      if (!d.open) d.showModal();
    } else {
      d.setAttribute("open", "");
    }
    var tutup = $("[data-tutup-modal]", isi);
    if (tutup) tutup.focus();
    return d;
  }

  function tutupModal() {
    var d = document.getElementById("modal");
    if (d.open) d.close();
    AudioMesin.hentiCakap();
  }

  /* ---------- KONFETI ---------- */
  function konfeti(n) {
    if (kurangkanGerak()) return;
    var k = document.getElementById("konfeti");
    var warna = ["#2e63f0", "#0e9d8c", "#d9507b", "#6f52e0", "#f6c453", "#12865f"];
    var banyak = n || 26;
    for (var i = 0; i < banyak; i++) {
      var p = document.createElement("i");
      p.className = "konfeti-t";
      p.style.left = (Math.random() * 100) + "%";
      p.style.background = warna[Math.floor(Math.random() * warna.length)];
      p.style.animationDuration = (2.2 + Math.random() * 1.4) + "s";
      p.style.animationDelay = (Math.random() * 0.5) + "s";
      p.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      k.appendChild(p);
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
      })(p);
    }
  }

  /* ---------- KESAN REVEAL & PARALAKS ---------- */
  function lekatPemerhati() {
    if (!("IntersectionObserver" in window)) {
      semua(".buka").forEach(function (el) { el.classList.add("nampak"); });
      return;
    }
    if (!pemerhati) {
      pemerhati = new IntersectionObserver(function (entri) {
        entri.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("nampak");
            pemerhati.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
    }
    semua(".buka").forEach(function (el) {
      if (!el.classList.contains("nampak")) pemerhati.observe(el);
    });
  }

  function lekatParalaks() {
    var pentas = $(".hero-pentas");
    if (!pentas) return;
    if (kurangkanGerak() || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)) return;
    var kad = semua(".kad-3d", pentas);
    var berjalan = false;
    window.addEventListener("scroll", function () {
      if (berjalan) return;
      berjalan = true;
      requestAnimationFrame(function () {
        var y = window.scrollY;
        if (y < 900) {
          kad.forEach(function (k, i) {
            var f = (i - 1) * 26;
            k.style.translate = "0 " + (y * (0.08 + i * 0.02) - f * 0.4) * -0.4 + "px";
          });
        }
        berjalan = false;
      });
    }, { passive: true });
  }

  /* ---------- BAR KEBOLECAPAIAN ---------- */
  function gunaA11y() {
    var s = Store.dapat();
    var h = document.documentElement;
    h.classList.toggle("font-lg", s.a11y.saiz === 1);
    h.classList.toggle("font-xl", s.a11y.saiz === 2);
    h.classList.toggle("dyslexic", !!s.a11y.disleksia);
    h.classList.toggle("kontras", !!s.a11y.kontras);
    h.classList.toggle("no-anim", !!s.a11y.noanim);
  }

  function bukaPopA11y() {
    var pop = document.getElementById("popA11y");
    if (!pop.hidden) { pop.hidden = true; return; }
    var s = Store.dapat();
    var h = document.documentElement;
    pop.innerHTML =
      '<h3>Kebolehcapaian</h3>' +
      '<div class="pop-item"><span>Saiz teks</span><span class="pop-langkah">' +
      '<button class="btn btn-ghost btn-kecil" data-a11y-saiz="-1" aria-label="Kurangkan saiz teks">A−</button>' +
      '<button class="btn btn-ghost btn-kecil" data-a11y-saiz="1" aria-label="Besarkan saiz teks">A+</button></span></div>' +
      '<div class="pop-item"><span>Font disleksia</span><button class="togol ' + (s.a11y.disleksia ? "hidup" : "") + '" data-a11y="disleksia" role="switch" aria-checked="' + !!s.a11y.disleksia + '" aria-label="Font disleksia"></button></div>' +
      '<div class="pop-item"><span>Kontras tinggi</span><button class="togol ' + (s.a11y.kontras ? "hidup" : "") + '" data-a11y="kontras" role="switch" aria-checked="' + !!s.a11y.kontras + '" aria-label="Kontras tinggi"></button></div>' +
      '<div class="pop-item"><span>Kurang animasi</span><button class="togol ' + (s.a11y.noanim ? "hidup" : "") + '" data-a11y="noanim" role="switch" aria-checked="' + !!s.a11y.noanim + '" aria-label="Kurang animasi"></button></div>' +
      '<div class="pop-item"><span>Bunyi</span><button class="togol ' + (s.sound ? "hidup" : "") + '" data-a11y="bunyi" role="switch" aria-checked="' + !!s.sound + '" aria-label="Bunyi"></button></div>' +
      '<div class="pop-item"><span>Kemajuan</span><button class="btn btn-ghost btn-kecil" data-a11y="reset">Tetapkan semula</button></div>';
    pop.hidden = false;
    var p = $("[data-a11y-saiz='-1']", pop);
    if (p) p.focus();
  }

  function tukarA11y(kunci, nilai) {
    var s = Store.dapat();
    if (kunci === "saiz") {
      s.a11y.saiz = Math.max(0, Math.min(2, s.a11y.saiz + nilai));
    } else if (kunci === "bunyi") {
      s.sound = !s.sound;
      AudioMesin.setHidup(s.sound);
      bunyiUI();
    } else if (kunci === "reset") {
      tutupPopA11y();
      modal(
        '<div class="modal-kepala"><h2>Tetapkan semula kemajuan?</h2></div>' +
        '<div class="modal-badan"><p>Semua XP, lencana dan skor akan dipadamkan daripada peranti ini. Tindakan ini tidak boleh dibatalkan.</p>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost" data-tutup-modal>Batal</button>' +
        '<button class="btn btn-utama" data-sah-reset>Ya, tetapkan semula</button></div></div>'
      );
      return;
    } else {
      s.a11y[kunci] = !s.a11y[kunci];
    }
    Store.simpan();
    gunaA11y();
    if (kunci === "bunyi") syncTogol("bunyi", s.sound);
    else if (kunci !== "saiz") syncTogol(kunci, s.a11y[kunci]);
    UI.toast(kunci === "bunyi" ? (s.sound ? "Bunyi dihidupkan" : "Bunyi dimatikan") : "Tetapan disimpan", "info");
  }

  function syncTogol(kunci, hidup) {
    var butang = $("#popA11y [data-a11y='" + kunci + "']");
    if (!butang) return;
    butang.classList.toggle("hidup", !!hidup);
    butang.setAttribute("aria-checked", String(!!hidup));
  }

  function tutupPopA11y() {
    var pop = document.getElementById("popA11y");
    pop.hidden = true;
  }

  /* ---------- BUNYI & XP UI ---------- */
  function bunyiUI() {
    var b = document.getElementById("btnBunyi");
    if (!b) return;
    var hidup = AudioMesin.getHidup();
    b.innerHTML = Ikon.iko(hidup ? "pembesarSuara" : "pembesarSuaraX", 20);
    b.setAttribute("aria-label", hidup ? "Bunyi: hidup" : "Bunyi: mati");
    b.setAttribute("aria-pressed", String(hidup));
  }

  function kepalaXP() {
    var t = document.getElementById("teksXp");
    if (t) t.textContent = Store.dapat().xp + " XP";
  }

  /* ---------- UTILITI ---------- */
  function acak(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function dengar(teks) {
    AudioMesin.bangunkan();
    AudioMesin.cakap(teks);
  }

  function esc(html) {
    return String(html).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function chipKategori(id) {
    var k = DataApp.KATEGORI[id];
    if (!k) return "";
    return '<span class="cip cip-kat ' + id + '">' + Ikon.iko(k.ikon, 15) + k.label + "</span>";
  }

  function ikonKategori(id, s) {
    var k = DataApp.KATEGORI[id];
    return Ikon.iko(k.ikon, s || 22);
  }

  return {
    daftar: daftar, hala: hala, render: render,
    $: $, semua: semua, acak: acak, esc: esc, dengar: dengar,
    toast: toast, toastXp: toastXp,
    modal: modal, tutupModal: tutupModal,
    konfeti: konfeti,
    lekatParalaks: lekatParalaks, kurangkanGerak: kurangkanGerak,
    gunaA11y: gunaA11y, bukaPopA11y: bukaPopA11y, tukarA11y: tukarA11y, tutupPopA11y: tutupPopA11y,
    bunyiUI: bunyiUI, kepalaXP: kepalaXP,
    chipKategori: chipKategori, ikonKategori: ikonKategori
  };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — PAPARAN (SCREENS)
   14 skrin papan cerita: Splash, Home, Belajar, 3 Modul,
   Latihan, Drag&Drop, AR, Bina Ayat, Cabaran, Keputusan,
   Lencana, Pandangan Guru.
   ============================================================ */
"use strict";

window.Screens = (function () {
  var D = DataApp;

  /* ---------- BAHAGIAN BERSAMA ---------- */
  function kepalaSkrin(kembali, tajuk, sub, chip) {
    var b = kembali
      ? '<a class="btn-belakang" href="' + kembali + '" aria-label="Kembali">' + Ikon.iko("anakPanahKiri", 20) + "</a>"
      : "";
    return '<div class="kepala-skrin">' + b +
      '<div class="kepala-skrin-teks"><h1>' + tajuk + "</h1>" +
      (chip ? '<div style="margin-top:10px">' + chip + "</div>" : "") +
      (sub ? '<p class="sub">' + sub + "</p>" : "") +
      "</div></div>";
  }

  function kaki() {
    return '<footer class="kaki"><div class="kaki-dalam">' +
      '<span class="kaki-tanda">KATA+ AR — Misi Kata Adjektif</span>' +
      '<span class="kaki-kod">Bahasa Melayu Tahun 3 · ' + D.INFO.kssr + " · SK " + D.INFO.sk + " · SP " + D.INFO.sp + "</span>" +
      '<span class="kaki-kod">' + D.INFO.skTeks + " " + D.INFO.spTeks + "</span>" +
      '<span class="kaki-privasi">Privasi: kamera digunakan hanya untuk mengesan pergerakan tangan. Tiada rakaman disimpan. Kemajuan disimpan di peranti ini sahaja.</span>' +
      "</div></footer>";
  }

  /* ---------- 02 HOME ---------- */
  function home() {
    var s = Store.dapat();
    var misiSelesai = Store.misiSelesaiCount();
    var langkah = D.MISI.map(function (m) {
      var selesai = !!s.misi[m.id];
      var seterusnya = !selesai && D.MISI.every(function (x) { return x.no >= m.no || !!s.misi[x.id]; });
      var cls = selesai ? "selesai" : (seterusnya ? "set" : "");
      return '<a class="langkah ' + cls + '" href="' + m.laluan + '">' +
        '<span class="langkah-nombor">' + (selesai ? Ikon.iko("semak", 18) : (m.no < 10 ? "0" + m.no : m.no)) + "</span>" +
        "<h3>" + m.nama + "</h3><p>" + m.pendek + "</p>" +
        '<span class="langkah-status">' +
        (selesai ? Ikon.iko("semakBulat", 14) + "Selesai" : (seterusnya ? Ikon.iko("anakPanahKanan", 14) + "Mula sekarang" : Ikon.iko("kunci", 13) + "Belum dibuka")) +
        "</span></a>";
    }).join("");

    var kad3d = [
      { k: "j", id: "jarak", kata: ["jauh", "dekat", "hampir", "rapat"] },
      { k: "p", id: "perasaan", kata: ["gembira", "sedih", "takut"] },
      { k: "pc", id: "pancaindera", kata: ["manis", "harum", "merdu"] }
    ].map(function (x) {
      var kat = D.KATEGORI[x.id];
      return '<div class="kad-3d ' + x.k + ' terapung buka" role="img" aria-label="Kategori ' + kat.label + '">' +
        '<div class="kad-3d-kepala"><span class="gelembung">' + Ikon.iko(kat.ikon, 20) + "</span><h3>" + kat.label.toUpperCase() + "</h3></div>" +
        "<p>" + kat.desc + "</p>" +
        '<div class="kad-3d-kata">' + x.kata.map(function (w) { return '<span class="kata-kecil">' + w + "</span>"; }).join("") +
        "</div></div>";
    }).join("");

    var kadKat = ["jarak", "perasaan", "pancaindera"].map(function (id) {
      var k = D.KATEGORI[id];
      var selesai = !!s.modul[id];
      return '<a class="kad kad-klik kad-kat ' + id + ' buka" href="#/modul/' + id + '">' +
        '<span class="kad-kat-iko">' + Ikon.iko(k.ikon, 26) + "</span>" +
        "<h3>" + k.label + "</h3><p>" + k.desc + "</p>" +
        '<div class="kad-kat-kata">' + k.kata.slice(0, 4).map(function (w) { return '<span class="kata-kecil">' + w + "</span>"; }).join("") + "</div>" +
        '<span class="kad-kat-status">' + (selesai ? Ikon.iko("semakBulat", 16) + "Selesai" : Ikon.iko("anakPanahKanan", 15) + "Mula belajar") + "</span></a>";
    }).join("");

    return {
      html:
        '<section class="hero" aria-label="Pengenalan">' +
        '<div class="hero-latar" aria-hidden="true"></div>' +
        '<span class="hero-eyebrow">' + Ikon.iko("kilau", 15) + " Bahasa Melayu · Tahun 3 · KSSR</span>" +
        '<h1 class="hero-h1">KATA+ <em>AR</em></h1>' +
        '<p class="hero-nama">Misi Kata Adjektif</p>' +
        '<p class="hero-tagline">「Kenali. Gerakkan. Pilih. Kuasai kata adjektif.」</p>' +
        '<div class="hero-cta">' +
        '<a class="btn btn-utama btn-lg" href="#/misi">Mulakan Misi ' + Ikon.iko("anakPanahKanan", 19) + "</a>" +
        '<button class="btn btn-ghost btn-lg" data-cara-bermain>Cara Bermain</button>' +
        "</div>" +
        '<div class="hero-pentas">' + kad3d + "</div>" +
        "</section>" +

        '<section class="seksyen" aria-labelledby="j-misi">' +
        '<div class="bekas"><div class="seksyen-kepala">' +
        "<h2 id=\"j-misi\">Perjalanan Misi Kamu</h2>" +
        "<p>" + misiSelesai + " / 5 misi selesai — teruskan memburu kata adjektif!</p>" +
        "</div>" +
        '<div class="laluan-misi">' + langkah + "</div></div></section>" +

        '<section class="seksyen" aria-labelledby="j-kuasa" style="padding-top:0">' +
        '<div class="bekas"><div class="seksyen-kepala">' +
        '<h2 id="j-kuasa">Tiga Kuasa Kata</h2>' +
        "<p>Tiga jenis kata adjektif yang akan kamu kuasai dalam misi ini.</p>" +
        "</div>" +
        '<div class="grid grid-3">' + kadKat + "</div></div></section>" +
        kaki(),
      init: function () {
        UI.lekatParalaks();
        document.querySelector("[data-cara-bermain]").addEventListener("click", function () {
          Screens.caraBermainModal();
        });
      }
    };
  }

  /* ---------- MODAL CARA BERMAIN ---------- */
  function caraBermainModal() {
    var gerak = D.GERAK.map(function (g) {
      return '<div class="gerak-item"><span class="gerak-iko">' + Ikon.iko(g.ikon, 30) + "</span>" +
        "<div><b>" + g.nama + "</b><span>" + g.desc + "</span></div></div>";
    }).join("");
    var misi = D.MISI.map(function (m) {
      return "<b>Misi " + (m.no < 10 ? "0" + m.no : m.no) + " — " + m.nama + "</b>: " + m.pendek;
    }).join("</p><p>");
    UI.modal(
      '<div class="modal-kepala"><h2>Cara Bermain</h2>' +
      '<button class="modal-tutup" data-tutup-modal aria-label="Tutup">' + Ikon.iko("silang", 18) + "</button></div>" +
      '<div class="modal-badan">' +
      "<h3>Perjalanan Kamu</h3><p>" + misi + "</p>" +
      "<h3>Gerakan Tangan (KATA+ AR)</h3>" +
      '<p>Dalam Misi 03, kamera mengesan tangan kamu. Gerakan ini boleh digunakan — dan kamu sentiasa boleh mengetik skrin sebagai gantian.</p>' +
      '<div class="gerak-senarai">' + gerak + "</div>" +
      "<h3>Petua</h3>" +
      "<p>1. Jawab perlahan-lahan — tiada had masa dalam misi ini.<br>" +
      "2. Salah jawapan tidak mengapa. Petunjuk akan membantu kamu.<br>" +
      "3. Kumpul XP dan lencana untuk menjadi Master Kata Adjektif.</p>" +
      "<h3>Privasi</h3>" +
      "<p>" + D.INFO.privasiPenuh + "</p>" +
      "</div>"
    );
  }

  /* ---------- ONBOARDING ---------- */
  var obLangkah = 0;

  function onboardingBuka() {
    obLangkah = 0;
    var ob = document.getElementById("onboard");
    ob.hidden = false;
    if (!ob.__berwayar) {
      ob.__berwayar = true;
      ob.addEventListener("click", function (e) {
        var b = e.target.closest("[data-ob-seterusnya]");
        if (b) { obLangkah++; obOnboarding(ob); AudioMesin.klik(); return; }
        var l = e.target.closest("[data-ob-lewati]");
        if (l) { obTutup(); AudioMesin.klik(); return; }
        var m = e.target.closest("[data-ob-mula]");
        if (m) { AudioMesin.berjaya(); obTutup(); }
      });
    }
    obOnboarding(ob);
  }

  function obOnboarding(ob) {
    var s = Store.dapat();
    if (obLangkah === 0) {
      ob.innerHTML = '<div class="ob-kandungan"><div class="ob-langkah">' +
        '<h2>Hai, Penjelajah Kata!</h2>' +
        "<p>Selamat datang ke dunia kata adjektif.</p>" +
        '<div class="ob-kat">' + obKatKad(0) + obKatKad(1) + obKatKad(2) + "</div>" +
        '<div class="ob-dots"><i class="aktif"></i><i></i><i></i></div>' +
        '<div class="ob-aksi"><button class="btn btn-utama btn-lg" data-ob-seterusnya>Seterusnya ' + Ikon.iko("anakPanahKanan", 18) + "</button></div>" +
        '<button class="ob-lewati" data-ob-lewati>Lewati</button>' +
        "</div></div>";
    } else if (obLangkah === 1) {
      ob.innerHTML = '<div class="ob-kandungan"><div class="ob-langkah">' +
        '<h2>Hari ini kita akan memburu kata adjektif.</h2>' +
        "<p>Kata adjektif menerangkan sesuatu — jarak, perasaan dan deria kita.</p>" +
        '<div class="ob-dots"><i></i><i class="aktif"></i><i></i></div>' +
        '<div class="ob-aksi"><button class="btn btn-utama btn-lg" data-ob-seterusnya>Seterusnya ' + Ikon.iko("anakPanahKanan", 18) + "</button></div>" +
        '<button class="ob-lewati" data-ob-lewati>Lewati</button>' +
        "</div></div>";
    } else {
      ob.innerHTML = '<div class="ob-kandungan"><div class="ob-langkah">' +
        '<h2>Tiga kuasa kata menanti kamu.</h2>' +
        "<p>Kenali setiap kategori, selesaikan misi, dan kumpul lencana!</p>" +
        '<div class="ob-kat">' + obKatKad(0) + obKatKad(1) + obKatKad(2) + "</div>" +
        '<div class="ob-dots"><i></i><i></i><i class="aktif"></i></div>' +
        '<div class="ob-aksi"><button class="btn btn-utama btn-lg" data-ob-mula>Jom Mula ' + Ikon.iko("play", 18) + "</button></div>" +
        "</div></div>";
    }
  }

  function obKatKad(i) {
    var ids = ["jarak", "perasaan", "pancaindera"];
    var k = D.KATEGORI[ids[i]];
    return '<div class="ob-kat-kad" style="animation-delay:' + (i * 0.14) + 's">' +
      '<span class="gelembung" style="background:var(--' + ids[i] + ')">' + Ikon.iko(k.ikon, 23) + "</span>" +
      "<b>" + k.label.toUpperCase() + "</b><span>" + k.desc + "</span></div>";
  }

  function obTutup() {
    var s = Store.dapat();
    s.onboarded = true;
    Store.simpan();
    var ob = document.getElementById("onboard");
    ob.hidden = true;
  }

  /* ---------- 03 BELAJAR (papan pemuka) ---------- */
  function belajar() {
    var s = Store.dapat();
    var kad = ["jarak", "perasaan", "pancaindera"].map(function (id) {
      var k = D.KATEGORI[id];
      var selesai = !!s.modul[id];
      var pct = Store.peratusKat(id);
      return '<a class="kad kad-klik kad-kat ' + id + ' buka" href="#/modul/' + id + '">' +
        '<span class="kad-kat-iko">' + Ikon.iko(k.ikon, 26) + "</span>" +
        "<h3>" + k.label + "</h3><p>" + k.desc + "</p>" +
        '<div class="kad-kat-kata">' + k.kata.map(function (w) { return '<span class="kata-kecil">' + w + "</span>"; }).join("") + "</div>" +
        '<span class="kad-kat-status">' +
        (selesai ? Ikon.iko("semakBulat", 16) + "Selesai · ketepatan " + (pct === null ? "—" : pct + "%") : Ikon.iko("play", 15) + "Mula belajar") +
        "</span></a>";
    }).join("");

    return {
      html: '<div class="bekas">' +
        kepalaSkrin("", "Belajar", "Kenali tiga jenis kata adjektif mengikut konteks. Selesaikan ketiga-tiga modul untuk membuka Misi 01.", "") +
        '<div class="grid grid-3">' + kad + "</div>" +
        '<div class="kad panel-info" style="margin-top:22px">' +
        "<h3>" + Ikon.iko("buku", 20) + " Info Kurikulum</h3>" +
        "<p><strong>Standard Kandungan " + D.INFO.sk + ":</strong> " + D.INFO.skTeks + "</p>" +
        "<p><strong>Standard Pembelajaran " + D.INFO.sp + ":</strong> " + D.INFO.spTeks + "</p>" +
        '<p style="margin-bottom:0">' + D.INFO.kssr + "</p></div>" +
        "</div>",
      init: null
    };
  }

  /* ---------- 04–06 MODUL ---------- */
  function modul(id) {
    var k = D.KATEGORI[id];
    var m = D.MODUL[id];
    var s = Store.dapat();
    return {
      html: '<div class="bekas bekas-sempit">' +
        kepalaSkrin("#/belajar", m.tajuk, m.intro, UI.chipKategori(id)) +
        '<div class="jalur" aria-hidden="true"><div class="jalur-dalam" id="modul-jalur" style="width:4%"></div></div>' +
        '<div id="modul-kandungan" style="margin-top:24px"></div>' +
        "</div>",
      init: function () {
        Modul.init(id);
      }
    };
  }

  /* ---------- MISI HUB ---------- */
  function misi() {
    var s = Store.dapat();
    var n = Store.misiSelesaiCount();
    var senarai = D.MISI.map(function (m) {
      var selesai = !!s.misi[m.id];
      var seterusnya = !selesai && D.MISI.every(function (x) { return x.no >= m.no || !!s.misi[x.id]; });
      var cls = "kad-misi" + (selesai ? " selesai" : "") + (seterusnya ? " seterusnya" : "");
      return '<a class="' + cls + '" href="' + m.laluan + '">' +
        '<span class="misi-nombro">' + (selesai ? Ikon.iko("semak", 22) : (m.no < 10 ? "0" + m.no : m.no)) + "</span>" +
        '<div class="misi-meta"><h3>' + m.nama +
        (selesai ? '<span class="misi-tag selesai">Selesai</span>' : "") +
        (seterusnya ? '<span class="misi-tag set">Seterusnya</span>' : "") +
        '<span class="misi-tag xp">+' + m.xp + " XP</span></h3>" +
        "<p>" + m.pendek + "</p></div>" +
        '<span class="misi-panah">' + Ikon.iko("chevronKanan", 22) + "</span></a>";
    }).join("");

    return {
      html: '<div class="bekas bekas-sempit">' +
        kepalaSkrin("", "Misi", "Lima misi menanti. Selesaikan satu demi satu untuk menjadi Master Kata Adjektif.", "") +
        '<div class="kad" style="padding:18px 24px;margin-bottom:22px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<strong>' + n + " / 5 Misi Selesai</strong>" +
        '<span style="font-size:13.5px;color:var(--dakwat3);font-weight:700">' + Math.round((n / 5) * 100) + "%</span></div>" +
        '<div class="jalur"><div class="jalur-dalam" style="width:' + (n / 5) * 100 + '%"></div></div></div>' +
        '<div class="misi-senarai">' + senarai + "</div>" +
        "</div>",
      init: null
    };
  }

  /* ---------- PEMBUNGKUS AKTIVITI ---------- */
  function sentuhPilih() {
    return {
      html: '<div class="bekas bekas-sempit">' +
        kepalaSkrin("#/misi", "Misi 02 — Sentuh & Pilih", "Sentuh jawapan yang paling tepat. Lihat gambar, baca cerita, kemudian pilih kata adjektif yang betul.", UI.chipKategori("jarak")) +
        '<div id="sentuh-kandungan"></div></div>',
      init: function () { Aktiviti.sentuh(); }
    };
  }

  function ar() {
    return {
      html: '<div class="bekas ar-bekas">' +
        kepalaSkrin("#/misi", "Misi 03 — Gerakkan Tangan", "KATA+ AR: gunakan kamera dan gerakan tangan untuk menangkap kata adjektif. Tiada rakaman disimpan.", UI.chipKategori("pancaindera")) +
        '<div id="ar-kandungan"></div></div>',
      init: function () { Ar.buka(); }
    };
  }

  function binaAyat() {
    return {
      html: '<div class="bekas bekas-sempit">' +
        kepalaSkrin("#/misi", "Misi 04 — Bina Ayat", "Dua aktiviti: masukkan kata ke tempatnya, kemudian lengkapkan ayat.", UI.chipKategori("perasaan")) +
        '<div id="bina-kandungan"></div></div>',
      init: function () { Aktiviti.binaAyat(); }
    };
  }

  function cabaran() {
    return {
      html: '<div class="bekas bekas-sempit">' +
        kepalaSkrin("#/misi", "Misi 05 — Cabaran Akhir", "10 soalan yang menggabungkan semua jenis kata adjektif. Tiada had masa — jawab dengan tenang.", "") +
        '<div id="kuiz-kandungan"></div></div>',
      init: function () { Kuiz.buka(); }
    };
  }

  /* ---------- 12 SKOR ---------- */
  function skor() {
    var s = Store.dapat();
    var n = Store.misiSelesaiCount();
    var pJ = Store.peratusKat("jarak");
    var pP = Store.peratusKat("perasaan");
    var pC = Store.peratusKat("pancaindera");
    var jumBetul = s.stat.jarak.betul + s.stat.perasaan.betul + s.stat.pancaindera.betul;
    var jumSemua = s.stat.jarak.jumlah + s.stat.perasaan.jumlah + s.stat.pancaindera.jumlah;

    function baris(id, label, pct) {
      return '<div class="baris-kat">' +
        '<div class="kat-nama"><span>' + UI.ikonKategori(id, 17) + label + "</span><span>" +
        (pct === null ? "Belum dinilai" : pct + "% · " + s.stat[id].betul + "/" + s.stat[id].jumlah + " betul") + "</span></div>" +
        '<div class="jalur kat-' + id + '"><div class="jalur-dalam" style="width:' + (pct === null ? 0 : pct) + '%"></div></div></div>';
    }

    return {
      html: '<div class="bekas">' +
        kepalaSkrin("", "Skor", "Papan pemuka kemajuan kamu. Teruskan berlatih untuk menguasai ketiga-tiga jenis kata adjektif.", "") +
        '<div class="kad papan-kepala">' +
        '<div class="papan-xp"><b>' + s.xp + "</b><span>XP</span></div>" +
        '<div class="papan-intro"><h2>' + Store.tahap() + "</h2>" +
        "<p>Kumpul XP dengan menyelesaikan modul dan misi.</p>" +
        '<span class="tahap">' + Ikon.iko("kilat", 15) + " " + s.xp + " XP terkumpul</span></div></div>" +
        '<div class="grid-stats">' +
        '<div class="kad kad-stat"><span class="stat-label">' + Ikon.iko("sasaran", 15) + ' Misi selesai</span><span class="stat-nombor">' + n + '/5</span></div>' +
        '<div class="kad kad-stat"><span class="stat-label">' + Ikon.iko("trofi", 15) + ' Kuiz terbaik</span><span class="stat-nombor">' + (s.kuizTerbaik > 0 ? s.kuizTerbaik + '%' : '—') + '</span></div>' +
        '<div class="kad kad-stat"><span class="stat-label">' + Ikon.iko("pingat", 15) + ' Lencana</span><span class="stat-nombor">' + s.lencana.length + '/4</span></div>' +
        '<div class="kad kad-stat"><span class="stat-label">' + Ikon.iko("semakBulat", 15) + ' Jawapan betul</span><span class="stat-nombor">' + jumBetul + (jumSemua ? '/' + jumSemua : '') + '</span></div>' +
        "</div>" +
        '<div class="kad" style="padding:24px 28px;margin-top:18px"><h3 style="margin:0 0 6px;font-size:19px;font-weight:800">Penguasaan Kategori</h3>' +
        '<p style="margin:0 0 4px;color:var(--dakwat2);font-size:14.5px">Kategori yang sering salah akan disenaraikan untuk latihan tambahan.</p>' +
        baris("jarak", "Jarak", pJ) + baris("perasaan", "Perasaan", pP) + baris("pancaindera", "Pancaindera", pC) +
        "</div>" +
        '<div class="papan-aksi">' +
        '<a class="btn btn-utama" href="#/lencana">' + Ikon.iko("pingat", 18) + " Koleksi Lencana</a>" +
        '<a class="btn btn-ghost" href="#/guru">' + Ikon.iko("pengguna", 18) + " Pandangan Guru</a>" +
        '<button class="btn btn-ghost" data-cetak>' + Ikon.iko("pencetak", 18) + " Cetak Laporan</button>" +
        "</div></div>",
      init: function () {
        document.querySelector("[data-cetak]").addEventListener("click", function () { window.print(); });
      }
    };
  }

  /* ---------- 13 LENCANA ---------- */
  function lencana() {
    var s = Store.dapat();
    var kad = D.LENCANA.map(function (l) {
      var ada = s.lencana.indexOf(l.id) !== -1;
      return '<div class="kad kad-lencana ' + (ada ? "dibuka" : "terkunci") + '">' +
        '<div class="lencana-iko ' + l.kelas + '">' + Ikon.iko(ada ? l.ikon : "kunci", 38) + "</div>" +
        "<h3>" + l.nama + "</h3><p>" + l.desc + "</p>" +
        '<span class="lencana-syarat">' + (ada ? "Dibuka" : l.syarat) + "</span></div>";
    }).join("");

    return {
      html: '<div class="bekas">' +
        kepalaSkrin("#/skor", "Koleksi Lencana", "Setiap lencana menandakan kemahiran baharu yang kamu kuasai.", "") +
        '<div class="galeri-lencana">' + kad + "</div></div>",
      init: null
    };
  }

  /* ---------- 14 PANDANGAN GURU ---------- */
  function guru() {
    var K = D.KELAS;
    var s = Store.dapat();

    var maxV = 100, w = 46, h = 180;
    function palang(ket, val, warna) {
      var tinggi = Math.round((val / maxV) * h);
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:8px">' +
        '<span style="font-weight:800;font-size:15px">' + val + "%</span>" +
        '<svg width="' + w + '" height="' + h + '" role="img" aria-label="' + ket + " " + val + '%">' +
        '<rect x="0" y="' + (h - tinggi) + '" width="' + w + '" height="' + tinggi + '" rx="10" fill="' + warna + '"/>' +
        '<rect x="0" y="' + (h - tinggi) + '" width="' + w + '" height="' + tinggi + '" rx="10" fill="rgba(23,24,28,0.08)"/>' +
        "</svg>" +
        '<span style="font-weight:700;font-size:13.5px">' + ket + "</span></div>";
    }

    var jadual = K.murid.map(function (m) {
      var purata = Math.round((m.jarak + m.perasaan + m.pancaindera) / 3);
      return "<tr><td><strong>" + m.nama + "</strong></td>" +
        '<td class="angka">' + m.jarak + "%</td>" +
        '<td class="angka ' + (m.perasaan < 75 ? "low" : "") + '">' + m.perasaan + "%</td>" +
        '<td class="angka">' + m.pancaindera + "%</td>" +
        '<td class="angka"><strong>' + purata + "%</strong></td></tr>";
    }).join("");

    var addie = D.ADDIE.map(function (f) {
      return '<div class="fasa"><b>' + f.fasa + "</b><span>" + f.teks + "</span></div>";
    }).join("");

    var n = Store.misiSelesaiCount();
    var item = D.INSTRUMEN.item.map(function (t, i) {
      return '<div class="instrumen-item"><div class="item-teks">' + (i + 1) + ". " + t + "</div>" +
        '<div class="skala-likert" role="radiogroup" aria-label="Item ' + (i + 1) + '">' +
        [1, 2, 3, 4, 5].map(function (v) {
          var aktif = s.instrumen.item[i] === v;
          return '<button type="button" data-likert="' + i + ":" + v + '" class="' + (aktif ? "aktif" : "") + '" role="radio" aria-checked="' + aktif + '" aria-label="' + v + '">' + v + "</button>";
        }).join("") +
        "</div>" +
        '<div class="skala-label"><span>' + D.INSTRUMEN.label[0] + "</span><span>" + D.INSTRUMEN.label[4] + "</span></div></div>";
    }).join("");

    var komen = D.INSTRUMEN.komen.map(function (t, i) {
      return '<div class="instrumen-item"><div class="item-teks">' + t + "</div>" +
        '<textarea rows="2" style="width:100%;border:1.5px solid var(--garis);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;resize:vertical" data-komen="' + i + '" placeholder="Tulis jawapan di sini...">' + UI.esc(s.instrumen.komen[i] || "") + "</textarea></div>";
    }).join("");

    return {
      html: '<div class="bekas">' +
        kepalaSkrin("#/skor", "Pandangan Guru", "Prestasi kelas, maklumat kurikulum dan instrumen penilaian produk.", "") +

        '<div class="kad" style="padding:28px 30px">' +
        '<h3 style="margin:0 0 4px;font-size:20px;font-weight:800">' + Ikon.iko("carta", 20) + " Prestasi Kelas</h3>" +
        '<p style="margin:0 0 22px;color:var(--dakwat2);font-size:14.5px">Purata markah kelas mengikut kategori (data contoh).</p>' +
        '<div style="display:flex;gap:34px;justify-content:center;flex-wrap:wrap">' +
        palang("Jarak", K.purata.jarak, "var(--jarak)") +
        palang("Perasaan", K.purata.perasaan, "var(--perasaan)") +
        palang("Pancaindera", K.purata.pancaindera, "var(--pancaindera)") +
        "</div></div>" +

        '<div class="kad panel-info">' +
        "<h3>" + Ikon.iko("pengguna", 20) + " Murid Kelas</h3>" +
        '<div class="jadual-bekas"><table class="jadual"><thead><tr>' +
        "<th>Nama</th><th>Jarak</th><th>Perasaan</th><th>Pancaindera</th><th>Purata</th></tr></thead>" +
        "<tbody>" + jadual + "</tbody></table></div>" +
        '<p style="margin:14px 0 0;font-size:13.5px">' + K.nota + "</p></div>" +

        '<div class="kad panel-info">' +
        "<h3>" + Ikon.iko("kilat", 20) + " Prestasi Peranti Ini</h3>" +
        "<p>Misi selesai: <strong>" + n + "/5</strong> · XP: <strong>" + s.xp + "</strong> · Kuiz terbaik: <strong>" + (s.kuizTerbaik > 0 ? s.kuizTerbaik + "%" : "—") + "</strong> · Lencana: <strong>" + s.lencana.length + "/4</strong></p>" +
        '<p style="margin-bottom:0">Ketepatan — Jarak: <strong>' + (Store.peratusKat("jarak") === null ? "—" : Store.peratusKat("jarak") + "%") + "</strong> · Perasaan: <strong>" + (Store.peratusKat("perasaan") === null ? "—" : Store.peratusKat("perasaan") + "%") + "</strong> · Pancaindera: <strong>" + (Store.peratusKat("pancaindera") === null ? "—" : Store.peratusKat("pancaindera") + "%") + "</strong></p></div>" +

        '<div class="kad panel-info">' +
        "<h3>" + Ikon.iko("buku", 20) + " Kurikulum & Model ADDIE</h3>" +
        "<p><strong>SK " + D.INFO.sk + ":</strong> " + D.INFO.skTeks + "</p>" +
        "<p><strong>SP " + D.INFO.sp + ":</strong> " + D.INFO.spTeks + "</p>" +
        '<div class="addie">' + addie + "</div></div>" +

        '<div class="kad panel-info">' +
        "<h3>" + Ikon.iko("pensel", 20) + " " + D.INSTRUMEN.tajuk + "</h3>" +
        "<p>" + D.INSTRUMEN.arahan + " Borang ini boleh diisi oleh rakan pembelajaran (sekurang-kurangnya 15 orang) dan dicetak untuk analisis.</p>" +
        item + komen +
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px">' +
        '<button class="btn btn-utama" data-simpan-instrumen>' + Ikon.iko("semak", 18) + " Simpan Penilaian</button>" +
        '<button class="btn btn-ghost" data-cetak-instrumen>' + Ikon.iko("pencetak", 18) + " Cetak Borang</button></div></div>" +
        "</div>",
      init: function () {
        document.querySelector("[data-cetak-instrumen]").addEventListener("click", function () { window.print(); });
        document.querySelector("[data-simpan-instrumen]").addEventListener("click", function () {
          var st = Store.dapat();
          UI.semua("[data-komen]").forEach(function (t) {
            st.instrumen.komen[parseInt(t.getAttribute("data-komen"), 10)] = t.value;
          });
          Store.simpan();
          UI.toast("Penilaian disimpan di peranti ini", "berjaya", "semakBulat");
        });
        document.addEventListener("click", onLikert);
      }
    };
  }

  function onLikert(e) {
    var t = e.target.closest("[data-likert]");
    if (!t) return;
    var b = t.getAttribute("data-likert").split(":");
    var i = parseInt(b[0], 10), v = parseInt(b[1], 10);
    var st = Store.dapat();
    st.instrumen.item[i] = v;
    Store.simpan();
    UI.semua('[data-likert^="' + i + ':"]').forEach(function (x) {
      x.classList.toggle("aktif", x.getAttribute("data-likert") === i + ":" + v);
      x.setAttribute("aria-checked", String(x.getAttribute("data-likert") === i + ":" + v));
    });
    AudioMesin.klik();
  }

  /* Wajib keluar semula dari pandangan guru */
  document.addEventListener("hashchange", function () {
    document.removeEventListener("click", onLikert);
  });

  return {
    home: home, belajar: belajar, modul: modul,
    misi: misi, sentuhPilih: sentuhPilih, ar: ar,
    binaAyat: binaAyat, cabaran: cabaran,
    skor: skor, lencana: lencana, guru: guru,
    onboardingBuka: onboardingBuka, obOnboarding: obOnboarding,
    obTutup: obTutup, caraBermainModal: caraBermainModal,
    kepalaSkrin: kepalaSkrin, kaki: kaki
  };
})();

</script>
<script>
/* ============================================================
   KATA+ AR — MODUL PEMBELAJARAN
   Modul 01 Jarak · Modul 02 Perasaan · Modul 03 Pancaindera
   Corak: Kenali (interaktif) → Cuba (soalan) → Selesai
   ============================================================ */
"use strict";

window.Modul = (function () {
  var D = DataApp;
  var keadaan = null; // { id, soalanIdx, sudahJawab, salahPercubaan }

  var lencanaMap = {
    jarak: "pemerhati-jarak",
    perasaan: "pembaca-perasaan",
    pancaindera: "pakar-pancaindera"
  };

  function init(id) {
    keadaan = { id: id, soalanIdx: 0 };
    var el = document.getElementById("modul-kandungan");
    if (!el) return;
    el.innerHTML = fasaKenali(id);
    wireKenali(id);
  }

  /* ============================================================
     FASA 1 — KENALI
     ============================================================ */
  function fasaKenali(id) {
    if (id === "jarak") return fasaJarak();
    if (id === "perasaan") return fasaPerasaan();
    return fasaPancaindera();
  }

  function fasaJarak() {
    var m = D.MODUL.jarak;
    var kataChips = m.kataJarak.map(function (k) {
      return '<button class="cip-kata" data-kata-jarak="' + k.kata + '">' + k.kata + "</button>";
    }).join("");
    var aksi = m.aksi.map(function (a) {
      return '<button class="btn btn-ghost btn-sm" data-jarak-aksi="' + a.nilai + '">' + a.label + "</button>";
    }).join("");
    return '<div class="kad visualizer">' +
      "<h3>Gerakkan Objek B</h3>" +
      "<p>Perhatikan perkataan yang sesuai dengan jarak antara Objek A dan Objek B.</p>" +
      '<div class="trek"><span class="objek objek-a" style="--n:0">' + Ikon.iko("rumah", 24) + '<span class="objek-label">Objek A</span></span>' +
      '<span class="objek objek-b" id="objekB">' + Ikon.iko("buku", 24) + '<span class="objek-label">Objek B</span></span></div>' +
      '<input type="range" class="gelangsar" id="gelangsarJarak" min="0" max="100" step="1" value="28" aria-label="Jarak antara Objek A dan Objek B">' +
      '<div class="kata-jarak-pilihan">' + kataChips + "</div>" +
      '<div class="visualizer-aksi">' + aksi + "</div>" +
      '<div class="kawal-soalan"><span class="jurang"></span>' +
      '<button class="btn btn-dengar btn-sm" data-dengar="dekat. Jauh. Hampir. Rapat." aria-label="Dengar sebutan">' + Ikon.iko("pembesarSuara", 17) + " Dengar Kata</button>" +
      '<button class="btn btn-utama" id="btnMulaCuba">' + Ikon.iko("play", 17) + " Cuba Soalan</button></div></div>";
  }

  function wireJarak() {
    var el = document.getElementById("modul-kandungan");
    var slider = document.getElementById("gelangsarJarak");
    var objekB = document.getElementById("objekB");
    var m = D.MODUL.jarak;

    function terapkan(nilai) {
      var trek = el.querySelector(".trek");
      var w = trek.clientWidth - 58;
      objekB.style.left = Math.round((w * nilai) / 100) + "px";
      slider.value = nilai;
      var aktif = "";
      m.kataJarak.forEach(function (k) {
        if (nilai >= k.min && nilai <= k.max) aktif = k.kata;
      });
      el.querySelectorAll("[data-kata-jarak]").forEach(function (b) {
        b.classList.toggle("aktif", b.getAttribute("data-kata-jarak") === aktif);
      });
    }

    slider.addEventListener("input", function () { terapkan(parseInt(slider.value, 10)); });
    el.querySelectorAll("[data-jarak-aksi]").forEach(function (b) {
      b.addEventListener("click", function () { terapkan(parseInt(b.getAttribute("data-jarak-aksi"), 10)); AudioMesin.klik(); });
    });
    el.querySelectorAll("[data-kata-jarak]").forEach(function (b) {
      b.addEventListener("click", function () {
        var kata = b.getAttribute("data-kata-jarak");
        var k = m.kataJarak.filter(function (x) { return x.kata === kata; })[0];
        terapkan(Math.round((k.min + k.max) / 2));
        UI.dengar(kata);
      });
    });
    document.getElementById("btnMulaCuba").addEventListener("click", function () {
      keadaan.soalanIdx = 0;
      fasaCuba();
    });
    window.addEventListener("resize", function () { terapkan(parseInt(slider.value, 10)); });
    setTimeout(function () { terapkan(28); }, 60);
  }

  function fasaPerasaan() {
    var m = D.MODUL.perasaan;
    var kad = m.wajah.map(function (w, i) {
      return '<button class="wajah-kad ' + (i === 0 ? "aktif" : "") + '" data-wajah="' + w.emosi + '" aria-pressed="' + (i === 0) + '">' +
        Ikon.wajah(w.emosi) +
        '<span class="wajah-nama">' + w.emosi + "</span></button>";
    }).join("");
    return '<div class="kad" style="padding:clamp(22px,4vw,40px)">' +
      "<h3 style=\"margin:0 0 6px;font-size:20px;font-weight:800\">Sentuh Setiap Wajah</h3>" +
      '<p style="margin:0 0 20px;color:var(--dakwat2);font-size:15.5px">Setiap wajah menunjukkan satu perasaan. Sentuh wajah untuk membaca ceritanya.</p>' +
      '<div class="galeri-wajah">' + kad + "</div>" +
      '<div id="kadCerita"></div>' +
      '<div class="kawal-soalan" style="margin-top:22px"><span class="jurang"></span>' +
      '<button class="btn btn-utama" id="btnMulaCuba">' + Ikon.iko("play", 17) + " Cuba Soalan</button></div></div>";
  }

  function wirePerasaan() {
    var el = document.getElementById("modul-kandungan");
    var m = D.MODUL.perasaan;
    function pilih(emosi) {
      el.querySelectorAll("[data-wajah]").forEach(function (b) {
        var on = b.getAttribute("data-wajah") === emosi;
        b.classList.toggle("aktif", on);
        b.setAttribute("aria-pressed", String(on));
      });
      var w = m.wajah.filter(function (x) { return x.emosi === emosi; })[0];
      document.getElementById("kadCerita").innerHTML =
        '<div class="kad-cerita">' + Ikon.wajah(w.emosi) +
        '<div class="cerita-teks"><strong>' + w.emosi.charAt(0).toUpperCase() + w.emosi.slice(1) + "</strong>" +
        "<span>" + w.ayat + "</span></div>" +
        '<button class="btn btn-dengar btn-sm" style="margin-left:auto" data-dengar="' + w.ayat + '" aria-label="Dengar ayat">' + Ikon.iko("pembesarSuara", 17) + "</button></div>";
    }
    el.querySelectorAll("[data-wajah]").forEach(function (b) {
      b.addEventListener("click", function () { pilih(b.getAttribute("data-wajah")); AudioMesin.klik(); });
    });
    document.getElementById("btnMulaCuba").addEventListener("click", function () { keadaan.soalanIdx = 0; fasaCuba(); });
    pilih(m.wajah[0].emosi);
  }

  function fasaPancaindera() {
    var m = D.MODUL.pancaindera;
    var kad = m.deria.map(function (d, i) {
      return '<button class="kad-deria ' + (i === 0 ? "aktif" : "") + '" data-deria="' + d.id + '" aria-pressed="' + (i === 0) + '">' +
        Ikon.objek(d.id) +
        '<span class="deria-nama">' + d.nama + "</span>" +
        '<span class="deria-kata">' + d.kata + "</span></button>";
    }).join("");
    return '<div class="kad" style="padding:clamp(22px,4vw,40px)">' +
      "<h3 style=\"margin:0 0 6px;font-size:20px;font-weight:800\">Gunakan Deria Kamu!</h3>" +
      '<p style="margin:0 0 20px;color:var(--dakwat2);font-size:15.5px">Sentuh setiap objek. Lima deria kita: mata (lihat), telinga (dengar), lidah (rasa), hidung (hidu), kulit (sentuh).</p>' +
      '<div class="galeri-deria">' + kad + "</div>" +
      '<div id="kadDeriaInfo"></div>' +
      '<div class="kawal-soalan" style="margin-top:22px"><span class="jurang"></span>' +
      '<button class="btn btn-utama" id="btnMulaCuba">' + Ikon.iko("play", 17) + " Cuba Soalan</button></div></div>";
  }

  function wirePancaindera() {
    var el = document.getElementById("modul-kandungan");
    var m = D.MODUL.pancaindera;
    function pilih(id) {
      el.querySelectorAll("[data-deria]").forEach(function (b) {
        var on = b.getAttribute("data-deria") === id;
        b.classList.toggle("aktif", on);
        b.setAttribute("aria-pressed", String(on));
      });
      var d = m.deria.filter(function (x) { return x.id === id; })[0];
      var adaAudio = d.audio
        ? '<button class="btn btn-dengar btn-sm" data-main-audio="' + d.audio + '" aria-label="Dengar bunyi">' + Ikon.iko("fonKepala", 17) + " Dengar Bunyi</button>"
        : "";
      document.getElementById("kadDeriaInfo").innerHTML =
        '<div class="kad-deria-info">' + Ikon.objek(d.id) +
        '<div class="info-teks"><strong>' + d.nama + " — " + d.kata + "</strong>" +
